    <path d="M110 96 C 92 86, 74 66, 70 40 C 84 48, 100 64, 110 92 Z"/>
    <path d="M110 96 C 96 80, 88 60, 90 36 C 100 50, 108 70, 110 92 Z" fill="#D4AF37"/>
