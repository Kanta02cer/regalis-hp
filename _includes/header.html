<header class="suits-header" id="suits-header">
  <div class="suits-header__inner">
    <!-- Logo -->
    <a href="{{ '/' | relative_url }}" class="suits-header__logo-link" aria-label="{{ site.title | escape }} ホームへ">
      <img src="{{ '/images/logo-rjpg.png' | relative_url }}" alt="{{ site.title | escape }}" height="36" style="display:block; height:36px; width:auto;">
    </a>

    <!-- Desktop Nav -->
    <nav aria-label="Main Navigation" class="suits-header__nav">
      <ul>
        <li><a href="{{ '/' | relative_url }}">TOP</a></li>
        <li><a href="{{ '/philosophy.html' | relative_url }}">PHILOSOPHY</a></li>
        <li><a href="{{ '/about-regalis-japan.html' | relative_url }}">ABOUT</a></li>
        <li><a href="{{ '/contact.html' | relative_url }}" class="suits-nav__cta suits-nav__cta--contact">CONTACT</a></li>
        <li><a href="{{ '/group/' | relative_url }}" class="suits-nav__cta suits-nav__cta--dx">REGALIS DX</a></li>
      </ul>
    </nav>

    <!-- Hamburger (mobile) -->
    <button class="suits-hamburger" id="suits-hamburger" aria-label="メニューを開く" aria-expanded="false" aria-controls="suits-mobile-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<!-- Mobile Nav Overlay -->
<nav id="suits-mobile-nav" class="suits-mobile-nav" aria-label="モバイルナビゲーション">
  <a href="{{ '/' | relative_url }}">TOP</a>
  <a href="{{ '/philosophy.html' | relative_url }}">PHILOSOPHY</a>
  <a href="{{ '/about-regalis-japan.html' | relative_url }}">ABOUT</a>
  <a href="{{ '/contact.html' | relative_url }}">CONTACT</a>
  <a href="{{ '/order-diagnosis.html' | relative_url }}">SUITS DIAGNOSIS</a>
  <a href="{{ '/journal.html' | relative_url }}">JOURNAL</a>
  <a href="{{ '/group/' | relative_url }}" style="color:#B89450; font-weight:600;">REGALIS DX — コーポレートサイト</a>
</nav>

<style>
/* ── Suits Header ──────────────────────────────────────────── */
.suits-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(17,17,17,0.08);
  transition: background 0.3s, border-color 0.3s;
}
.suits-header.scrolled {
  background: rgba(255,255,255,0.97);
  border-bottom-color: rgba(17,17,17,0.12);
}
.suits-header__inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

/* Logo */
.suits-header__logo-link {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  transition: opacity 0.2s;
}
.suits-header__logo-link:hover { opacity: 0.80; }

/* Desktop Nav */
.suits-header__nav { display: flex; align-items: center; }
.suits-header__nav ul {
  display: flex; align-items: center; gap: 4px;
  list-style: none; margin: 0; padding: 0;
}
.suits-header__nav a {
  font-family: 'Inter', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(17,17,17,0.60);
  text-decoration: none;
  padding: 6px 12px;
  transition: color 0.2s;
  position: relative;
}
.suits-header__nav a::after {
  content: '';
  position: absolute; bottom: 0; left: 12px; right: 12px;
  height: 1px; background: #2563EB;
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.22s;
}
.suits-header__nav a:hover { color: #111111; }
.suits-header__nav a:hover::after { transform: scaleX(1); }

/* CTA buttons */
.suits-nav__cta--contact {
  background: linear-gradient(135deg, #2563EB, #06B6D4) !important;
  color: #FFFFFF !important;
  border: none !important;
  border-radius: 4px !important;
  padding: 8px 18px !important;
  font-weight: 700 !important;
  transition: opacity 0.2s !important;
  box-shadow: 0 3px 12px rgba(37,99,235,0.28) !important;
}
.suits-nav__cta--contact::after { display: none !important; }
.suits-nav__cta--contact:hover { opacity: 0.88 !important; color: #FFFFFF !important; }

.suits-nav__cta--dx {
  background: transparent !important;
  color: #2563EB !important;
  border: 1px solid rgba(37,99,235,0.40) !important;
  border-radius: 4px !important;
  padding: 7px 14px !important;
  font-size: 10px !important;
  transition: background 0.2s !important;
}
.suits-nav__cta--dx::after { display: none !important; }
.suits-nav__cta--dx:hover { background: rgba(37,99,235,0.06) !important; }

/* Hamburger */
.suits-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 40px; height: 40px;
  background: none; border: none; cursor: pointer;
  padding: 8px; flex-shrink: 0;
}
.suits-hamburger span {
  display: block;
  width: 100%; height: 1px;
  background: rgba(17,17,17,0.70);
  transition: transform 0.25s, opacity 0.25s;
  transform-origin: center;
}
.suits-hamburger.is-open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.suits-hamburger.is-open span:nth-child(2) { opacity: 0; }
.suits-hamburger.is-open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* Mobile Nav */
.suits-mobile-nav {
  display: none;
  position: fixed;
  inset: 0; z-index: 49;
  background: rgba(255,255,255,0.98);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 80px 24px 40px;
}
.suits-mobile-nav.is-open { display: flex; }
.suits-mobile-nav a {
  font-family: 'Inter', sans-serif;
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(17,17,17,0.65);
  text-decoration: none;
  padding: 12px 0;
  border-bottom: 1px solid rgba(17,17,17,0.08);
  width: 100%; max-width: 320px; text-align: center;
  transition: color 0.2s;
}
.suits-mobile-nav a:hover { color: #2563EB; }

/* Responsive */
@media (max-width: 768px) {
  .suits-header__nav { display: none; }
  .suits-hamburger { display: flex; }
}
</style>

<script>
(function(){
  var btn = document.getElementById('suits-hamburger');
  var nav = document.getElementById('suits-mobile-nav');
  var header = document.getElementById('suits-header');
  if (!btn || !nav) return;
  btn.addEventListener('click', function(){
    var open = nav.classList.toggle('is-open');
    btn.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open);
    document.body.style.overflow = open ? 'hidden' : '';
  });
  nav.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      nav.classList.remove('is-open');
      btn.classList.remove('is-open');
      btn.setAttribute('aria-expanded', false);
      document.body.style.overflow = '';
    });
  });
  window.addEventListener('scroll', function(){
    header.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive: true });
})();
</script>
