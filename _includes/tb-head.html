<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ page.title }}</title>
<meta name="description" content="{{ page.tbdesc }}">
<meta name="keywords" content="{% if page.keywords %}{{ page.keywords }}{% else %}トリリオンバンク,HackⅡ,AI検索,LLMO,AIO,Pay per Crawl,AI情報流通{% endif %}">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

<!-- OGP -->
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.tbdesc }}">
<meta property="og:type" content="{% if page.layout == 'tb-article' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{% if page.og_image %}{{ page.og_image }}{% else %}https://trillion-bank.jp/trillionbank/assets/img/ogp.png{% endif %}">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="株式会社トリリオンバンク">
{% if page.layout == 'tb-article' %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta property="article:author" content="{% if page.author %}{{ page.author }}{% else %}井上 幹太{% endif %}">
{% endif %}<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.tbdesc }}">

<!-- Canonical + hreflang -->
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="ja" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">

<!-- AI / LLM Optimization -->
<meta name="ai-summary" content="{% if page.ai_summary %}{{ page.ai_summary }}{% else %}{{ page.tbdesc }}{% endif %}">
<link rel="llms-txt" href="{{ '/llms.txt' | absolute_url }}">
<link rel="llms-full" href="{{ '/llms-full.txt' | absolute_url }}">
<link rel="knowledge-graph" type="application/json" href="{{ '/knowledge.json' | absolute_url }}">

<!-- Favicon + Fonts + CSS -->
