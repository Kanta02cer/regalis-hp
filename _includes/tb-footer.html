<script>
(function(){
  // header: hide on scroll down, show on scroll up / at top
  var h=document.getElementById('tbh'), last=0;
  addEventListener('scroll',function(){
    var y=scrollY;
    h.classList.toggle('solid', y>8);
    if(y>last && y>140){ h.classList.add('hide'); } else { h.classList.remove('hide'); }
    last=y;
  },{passive:true});
  // mobile menu
  var b=document.getElementById('tbBurger');
  if(b) b.addEventListener('click',function(){h.classList.toggle('open')});
  document.querySelectorAll('.tbh .links a').forEach(function(a){a.addEventListener('click',function(){h.classList.remove('open')})});
  // reveal on scroll
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  document.querySelectorAll('.rv,.rv-s').forEach(function(el,i){el.style.transitionDelay=(i%3)*80+'ms';io.observe(el)});
  // 3D tilt on hover
  if(!matchMedia('(hover:none)').matches){
    document.querySelectorAll('[data-tilt]').forEach(function(c){
      c.addEventListener('mousemove',function(e){
        var r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
        c.style.transform='perspective(900px) rotateX('+(-py*7)+'deg) rotateY('+(px*9)+'deg) translateY(-6px)';
      });
      c.addEventListener('mouseleave',function(){c.style.transform=''});
    });
  }
})();
</script>
