<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://trillion-bank.jp/#website",
      "name": "株式会社Trillion Bank（トリリオンバンク）",
      "url": "https://trillion-bank.jp/",
      "inLanguage": "ja",
      "publisher": {"@id": "https://trillion-bank.jp/#organization"}
    },
    {
      "@type": "Organization",
      "@id": "https://trillion-bank.jp/#regalis-japan-group",
      "name": "Regalis Japan Group"
    },
    {
      "@type": "Organization",
      "@id": "https://trillion-bank.jp/#organization",
      "name": "株式会社Trillion Bank",
      "legalName": "株式会社Trillion Bank",
      "alternateName": ["株式会社トリリオンバンク", "トリリオンバンク", "Trillion Bank"],
      "url": "https://trillion-bank.jp/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://trillion-bank.jp/images/hero/tb-logo-symbol.webp",
        "width": 414,
        "height": 318
      },
      "parentOrganization": {"@id": "https://trillion-bank.jp/#regalis-japan-group"},
      "founder": {"@id": "https://trillion-bank.jp/#kanta-inoue"},
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "麹町六丁目2番1号 麹町サイトビル6階 ROOMZ",
        "addressLocality": "千代田区",
        "addressRegion": "東京都",
        "postalCode": "102-0083",
        "addressCountry": "JP"
      },
      "sameAs": [
        "https://www.instagram.com/trillionbank_jp/"
      ],
      "subjectOf": [
        {"@type": "VideoObject", "name": "令和の虎 CHANNEL（人財版）出演回", "url": "https://www.youtube.com/watch?v=tXTnZBE4-wM"},
        {"@type": "VideoObject", "name": "令和の虎 CHANNEL（受験生版）出演回", "url": "https://youtu.be/tvK855skBTM"},
        {"@type": "VideoObject", "name": "Nontitle Season 6 出演回", "url": "https://youtu.be/AcJNa6jw1IY"},
        {"@type": "VideoObject", "name": "SBI証券ビジネスドライブ出演回", "url": "https://youtu.be/F2hO--D6Hd0"}
      ]
    },
    {
      "@type": "Person",
      "@id": "https://trillion-bank.jp/#kanta-inoue",
      "name": "井上幹太",
      "alternateName": ["Kanta Inoue", "かんちゃん"],
      "jobTitle": "代表取締役CEO",
      "worksFor": {"@id": "https://trillion-bank.jp/#organization"}
    },
    {
      "@type": "Organization",
      "@id": "https://trillion-bank.jp/#editorial-team",
      "name": "株式会社Trillion Bank編集部",
      "url": "https://trillion-bank.jp/trillionbank/company/",
      "parentOrganization": {"@id": "https://trillion-bank.jp/#organization"}
    },
    {
      "@type": "LocalBusiness",
      "@id": "https://trillion-bank.jp/#localbusiness",
      "name": "株式会社Trillion Bank",
      "url": "https://trillion-bank.jp/",
      "parentOrganization": {"@id": "https://trillion-bank.jp/#regalis-japan-group"},
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "麹町六丁目2番1号 麹町サイトビル6階 ROOMZ",
        "addressLocality": "千代田区",
        "addressRegion": "東京都",
        "postalCode": "102-0083",
        "addressCountry": "JP"
      },
      "areaServed": [
        {"@type": "Place", "name": "麹町"},
        {"@type": "AdministrativeArea", "name": "千代田区"},
        {"@type": "AdministrativeArea", "name": "東京都"},
        {"@type": "Country", "name": "JP"}
      ]
    },
    {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}#webpage",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | jsonify }},
      "description": {{ page.excerpt_text | default: page.title | truncate: 160 | jsonify }},
      "inLanguage": "ja",
      "isPartOf": {"@id": "https://trillion-bank.jp/#website"},
      "about": {"@id": "https://trillion-bank.jp/#organization"},
      "mainEntity": {"@id": "{{ page.url | absolute_url }}#article"},
      "breadcrumb": {"@id": "{{ page.url | absolute_url }}#breadcrumb"},
      "dateModified": "{% if page.last_modified %}{{ page.last_modified }}T00:00:00+09:00{% else %}{{ page.date | date: '%Y-%m-%dT00:00:00+09:00' }}{% endif %}"
    },
    {
      "@type": "Article",
      "@id": "{{ page.url | absolute_url }}#article",
      "headline": {{ page.title | truncate: 110 | jsonify }},
      "description": {{ page.excerpt_text | default: page.title | truncate: 160 | jsonify }},
      "datePublished": "{{ page.date | date: '%Y-%m-%dT00:00:00+09:00' }}",
      "dateModified": "{% if page.last_modified %}{{ page.last_modified }}T00:00:00+09:00{% else %}{{ page.date | date: '%Y-%m-%dT00:00:00+09:00' }}{% endif %}",
      "author": {"@id": "{% if page.author_type == 'Organization' %}https://trillion-bank.jp/#editorial-team{% else %}https://trillion-bank.jp/#kanta-inoue{% endif %}"},
      "publisher": {"@id": "https://trillion-bank.jp/#organization"},
      "mainEntityOfPage": {"@id": "{{ page.url | absolute_url }}#webpage"},
      "image": {
        "@type": "ImageObject",
        "url": "{{ page.og_image | default: '/images/hero/tb-logo-color.webp' | absolute_url }}",
        "width": 1366,
        "height": 768
      },
      "inLanguage": "ja",
      "articleSection": {{ page.category | default: "AI検索最適化" | jsonify }},
      "keywords": {{ page.keywords | default: "LLMO,AIO,AEO,GEO,AI検索最適化" | jsonify }}
    },
{% if page.faq_items %}
    {
      "@type": "FAQPage",
      "@id": "{{ page.url | absolute_url }}#faq",
      "mainEntity": [
{% for item in page.faq_items %}
        {
          "@type": "Question",
          "name": {{ item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ item.answer | jsonify }}
          }
        }{% unless forloop.last %},{% endunless %}
{% endfor %}
      ]
    },
{% endif %}
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "トップ", "item": "https://trillion-bank.jp/"},
        {"@type": "ListItem", "position": 2, "name": "お知らせ・Journal", "item": "https://trillion-bank.jp/news/"},
        {"@type": "ListItem", "position": 3, "name": {{ page.title | truncate: 80 | jsonify }}, "item": "{{ page.url | absolute_url }}"}
      ]
    }
  ]
}
</script>
