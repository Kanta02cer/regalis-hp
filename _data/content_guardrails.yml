last_reviewed: "2026-09-05"
restricted_patterns:
  - name: "unsupported company superlative"
    regex: "(株式会社Trillion Bank|トリリオンバンク|HackⅡ|Hack2|HackII|Adctor|当社|弊社).{0,50}(世界初|日本初|業界唯一|完全自動|必ず表示|売上保証|問い合わせ保証)"
    reason: "会社・製品に関する最上級・保証表現は、比較調査または契約上の根拠と承認が必要"
  - name: "legacy AICS branding"
    regex: "(AICS™|AI Exclusive|Regalis AIO Intelligence|中央集権型API|タグ1行で即日)"
    reason: "旧構想または未承認名称"
  - name: "legacy suit domain"
    regex: "regalis-order-suits\\.com"
    reason: "旧ドメイン"
private_patterns:
  - name: "Japanese mobile phone"
    regex: "0[789]0[- ]?\\d{4}[- ]?\\d{4}"
  - name: "credential assignment"
    regex: "(?i)(api[_ -]?key|client[_ -]?secret|access[_ -]?token|refresh[_ -]?token|password)\\s*[:=]\\s*[^\\s<{]{8,}"
  - name: "valuation or cap table"
    regex: "(pre[- ]?money|post[- ]?money|バリュエーション|完全希薄化|株主構成|持株比率|発行済株式)"
  - name: "cash and runway"
    regex: "(現預金|銀行残高|ランウェイ)"
allowed_paths:
  - "PUBLICATION_POLICY.md"
  - "_data/content_guardrails.yml"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "docs/"
  - "prompts/"
  - ".agents/"
  - ".codex/"
  - "scripts/content_guard.py"
scan_extensions: [".md", ".html", ".yml", ".yaml", ".json", ".txt", ".xml", ".js"]
public_roots:
  - "index.html"
  - "trillionbank"
  - "_tbnews"
  - "_includes"
  - "_layouts"
  - "_data"
  - "llms.txt"
  - "llms-full.txt"
  - "knowledge.json"
  - "site-structure.json"
