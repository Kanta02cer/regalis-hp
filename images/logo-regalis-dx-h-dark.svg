<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none" role="img" aria-label="Regalis DX Logo">
  <title>Regalis DX</title>
  <defs>
    <style>
      .lg-brand { font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif; }
      .lg-sub   { font-family: 'Inter', 'Arial', sans-serif; }
    </style>
  </defs>

  <!-- LION MARK (scaled 0.54x, for dark background → white lion body) -->
  <g transform="translate(3, 3) scale(0.54)">

    <!-- CIRCUIT MANE (gold — same both themes) -->
    <line x1="50" y1="17" x2="50" y2="4" stroke="#B89450" stroke-width="1.2" stroke-opacity="0.8"/>
    <polygon points="50,0 53.5,3.5 50,7 46.5,3.5" fill="#C5A059" opacity="0.85"/>
    <polyline points="35,21 35,10 22,10 22,3" stroke="#B89450" stroke-width="1" stroke-opacity="0.65" fill="none"/>
    <rect x="18.5" y="-0.5" width="7" height="7" rx="1" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.65"/>
    <polyline points="65,21 65,10 78,10 78,3" stroke="#B89450" stroke-width="1" stroke-opacity="0.65" fill="none"/>
    <rect x="74.5" y="-0.5" width="7" height="7" rx="1" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.65"/>
    <line x1="20" y1="50" x2="4" y2="50" stroke="#B89450" stroke-width="1.1" stroke-opacity="0.7"/>
    <polyline points="7,47 3,50 7,53" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.7"/>
    <line x1="80" y1="50" x2="96" y2="50" stroke="#B89450" stroke-width="1.1" stroke-opacity="0.7"/>
    <polyline points="93,47 97,50 93,53" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.7"/>
    <circle cx="50" cy="17" r="2.2" fill="#B89450" opacity="0.75"/>
    <circle cx="35" cy="21" r="1.8" fill="#B89450" opacity="0.6"/>
    <circle cx="65" cy="21" r="1.8" fill="#B89450" opacity="0.6"/>
    <circle cx="20" cy="50" r="1.8" fill="#B89450" opacity="0.65"/>
    <circle cx="80" cy="50" r="1.8" fill="#B89450" opacity="0.65"/>
    <path d="M35 21 Q50 14 65 21" stroke="#B89450" stroke-width="0.5" stroke-opacity="0.18" fill="none"/>

    <!-- MANE SILHOUETTE (dark bg version — mane blends into dark bg) -->
    <path d="M50 13 L57 16 L64 14 L68 20 L76 26 L78 34 L82 42 L80 50 L80 60 L76 68 L70 76 L64 80 L58 83 L50 85 L42 83 L36 80 L30 76 L24 68 L20 60 L20 50 L18 42 L22 34 L24 26 L32 20 L36 14 L43 16 Z" fill="#0A0E18" opacity="0.9"/>

    <!-- HEAD (white/light on dark bg) -->
    <ellipse cx="50" cy="54" rx="22" ry="24" fill="rgba(248,246,242,0.95)"/>
    <path d="M30 40 L26 23 L41 34 Z" fill="rgba(248,246,242,0.95)"/>
    <path d="M31 39 L28 26 L39 34 Z" fill="#B89450" fill-opacity="0.3"/>
    <path d="M70 40 L74 23 L59 34 Z" fill="rgba(248,246,242,0.95)"/>
    <path d="M69 39 L72 26 L61 34 Z" fill="#B89450" fill-opacity="0.3"/>

    <!-- CROWN -->
    <path d="M42 33 L45 26 L50 31 L55 26 L58 33" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.8" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="42" y1="33" x2="58" y2="33" stroke="#B89450" stroke-width="0.8" stroke-opacity="0.55"/>

    <!-- BROWS -->
    <path d="M30 48 L41 43" stroke="#B89450" stroke-width="2.2" stroke-linecap="butt" stroke-opacity="0.75"/>
    <path d="M59 43 L70 48" stroke="#B89450" stroke-width="2.2" stroke-linecap="butt" stroke-opacity="0.75"/>

    <!-- EYES -->
    <circle cx="41" cy="51" r="7.5" fill="#B89450" fill-opacity="0.1" stroke="#B89450" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="41" cy="51" r="4.8" fill="#C5A059"/>
    <ellipse cx="41" cy="51" rx="1.8" ry="2.6" fill="#080C14"/>
    <circle cx="42.8" cy="49.2" r="1.1" fill="white" opacity="0.9"/>
    <circle cx="59" cy="51" r="7.5" fill="#B89450" fill-opacity="0.1" stroke="#B89450" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="59" cy="51" r="4.8" fill="#C5A059"/>
    <ellipse cx="59" cy="51" rx="1.8" ry="2.6" fill="#080C14"/>
    <circle cx="60.8" cy="49.2" r="1.1" fill="white" opacity="0.9"/>

    <!-- NOSE / MUZZLE -->
    <path d="M46.5 61.5 L50 66 L53.5 61.5 C51.5 58.5 48.5 58.5 46.5 61.5 Z" fill="#555"/>
    <ellipse cx="50" cy="66" rx="10" ry="8" fill="#E8E4DC" opacity="0.6"/>
    <path d="M44 69.5 Q47.5 72 50 70.5 Q52.5 72 56 69.5" stroke="#AAA" stroke-width="1.3" fill="none"/>

    <!-- WHISKER PIXELS -->
    <rect x="24" y="62" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.35"/>
    <rect x="27.5" y="66" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.25"/>
    <rect x="71.5" y="62" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.35"/>
    <rect x="68" y="66" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.25"/>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="66" y1="12" x2="66" y2="48" stroke="rgba(248,246,242,0.2)" stroke-width="0.5"/>

  <!-- WORDMARK (white on dark) -->
  <text x="76" y="33" class="lg-brand"
        font-size="20" font-weight="300" letter-spacing="3.5"
        fill="rgba(248,246,242,0.95)" text-anchor="start">REGALIS</text>
  <text x="78" y="48" class="lg-sub"
        font-size="9" font-weight="600" letter-spacing="4.5"
        fill="#B89450" text-anchor="start">DX</text>

  <circle cx="73" cy="30" r="1.5" fill="#B89450" opacity="0.6"/>
  <circle cx="73" cy="45" r="1" fill="#B89450" opacity="0.35"/>

</svg>
