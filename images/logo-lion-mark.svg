<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Regalis Lion Mark">
  <title>Regalis DX — Lion Mark</title>

  <!-- ════════════════════════════════════════
       CIRCUIT MANE — PCB trace framework
       Gold hardcoded (#B89450) — works on any bg
  ════════════════════════════════════════ -->

  <!-- ARM TOP (vertical, primary) -->
  <line x1="50" y1="17" x2="50" y2="4" stroke="#B89450" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Diamond node at apex -->
  <polygon points="50,0 53.5,3.5 50,7 46.5,3.5" fill="#C5A059" opacity="0.85"/>

  <!-- ARM TOP-LEFT (PCB elbow turn) -->
  <polyline points="35,21 35,10 22,10 22,3" stroke="#B89450" stroke-width="1" stroke-opacity="0.65" fill="none"/>
  <rect x="18.5" y="-0.5" width="7" height="7" rx="1" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.65"/>

  <!-- ARM TOP-RIGHT (PCB elbow turn) -->
  <polyline points="65,21 65,10 78,10 78,3" stroke="#B89450" stroke-width="1" stroke-opacity="0.65" fill="none"/>
  <rect x="74.5" y="-0.5" width="7" height="7" rx="1" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.65"/>

  <!-- ARM LEFT (horizontal, with arrow cap) -->
  <line x1="20" y1="50" x2="4" y2="50" stroke="#B89450" stroke-width="1.1" stroke-opacity="0.7"/>
  <polyline points="7,47 3,50 7,53" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.7"/>

  <!-- ARM RIGHT (horizontal, with arrow cap) -->
  <line x1="80" y1="50" x2="96" y2="50" stroke="#B89450" stroke-width="1.1" stroke-opacity="0.7"/>
  <polyline points="93,47 97,50 93,53" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.7"/>

  <!-- ARM BOTTOM-LEFT (diagonal, shorter) -->
  <line x1="32" y1="74" x2="20" y2="86" stroke="#B89450" stroke-width="0.9" stroke-opacity="0.4"/>
  <circle cx="18" cy="88" r="2.5" stroke="#B89450" stroke-width="0.9" fill="none" stroke-opacity="0.4"/>

  <!-- ARM BOTTOM-RIGHT (diagonal, shorter) -->
  <line x1="68" y1="74" x2="80" y2="86" stroke="#B89450" stroke-width="0.9" stroke-opacity="0.4"/>
  <circle cx="82" cy="88" r="2.5" stroke="#B89450" stroke-width="0.9" fill="none" stroke-opacity="0.4"/>

  <!-- Junction dots at arm bases (PCB via) -->
  <circle cx="50" cy="17" r="2.2" fill="#B89450" opacity="0.75"/>
  <circle cx="35" cy="21" r="1.8" fill="#B89450" opacity="0.6"/>
  <circle cx="65" cy="21" r="1.8" fill="#B89450" opacity="0.6"/>
  <circle cx="20" cy="50" r="1.8" fill="#B89450" opacity="0.65"/>
  <circle cx="80" cy="50" r="1.8" fill="#B89450" opacity="0.65"/>

  <!-- Subtle connecting arc between top nodes (trace bridge) -->
  <path d="M35 21 Q50 14 65 21" stroke="#B89450" stroke-width="0.5" stroke-opacity="0.18" fill="none"/>

  <!-- ════════════════════════════════════════
       MANE SILHOUETTE — angular geometric crown
       fill="currentColor" → black on white bg, white on dark bg
  ════════════════════════════════════════ -->
  <path d="
    M50 13
    L57 16 L64 14 L68 20
    L76 26 L78 34
    L82 42 L80 50
    L80 60 L76 68
    L70 76 L64 80
    L58 83 L50 85
    L42 83 L36 80
    L30 76 L24 68
    L20 60 L20 50
    L18 42 L22 34
    L24 26 L32 20
    L36 14 L43 16 Z
  " fill="currentColor" opacity="0.96"/>

  <!-- ════════════════════════════════════════
       LION HEAD — geometric front-facing
  ════════════════════════════════════════ -->

  <!-- Head oval -->
  <ellipse cx="50" cy="54" rx="22" ry="24" fill="currentColor"/>

  <!-- LEFT EAR -->
  <path d="M30 40 L26 23 L41 34 Z" fill="currentColor"/>
  <!-- Ear inner (gold) -->
  <path d="M31 39 L28 26 L39 34 Z" fill="#B89450" fill-opacity="0.22"/>

  <!-- RIGHT EAR -->
  <path d="M70 40 L74 23 L59 34 Z" fill="currentColor"/>
  <!-- Ear inner (gold) -->
  <path d="M69 39 L72 26 L61 34 Z" fill="#B89450" fill-opacity="0.22"/>

  <!-- CROWN (Regalis = 王者) — geometric 3-point crown above forehead -->
  <path d="M42 33 L45 26 L50 31 L55 26 L58 33" stroke="#B89450" stroke-width="1" fill="none" stroke-opacity="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Crown base line -->
  <line x1="42" y1="33" x2="58" y2="33" stroke="#B89450" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- BROW LINES — angular, powerful (shows intelligence / dominance) -->
  <path d="M30 48 L41 43" stroke="#B89450" stroke-width="2.2" stroke-linecap="butt" stroke-opacity="0.6"/>
  <path d="M59 43 L70 48" stroke="#B89450" stroke-width="2.2" stroke-linecap="butt" stroke-opacity="0.6"/>

  <!-- Forehead center indicator (digital) -->
  <line x1="50" y1="34" x2="50" y2="40" stroke="#B89450" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="50" cy="40" r="1.6" fill="#B89450" opacity="0.38"/>

  <!-- ════════════════════════════════════════
       EYES — gold LED digital eyes (most recognizable feature)
  ════════════════════════════════════════ -->

  <!-- LEFT EYE -->
  <!-- Outer ambient glow ring -->
  <circle cx="41" cy="51" r="7.5" fill="#B89450" fill-opacity="0.06" stroke="#B89450" stroke-width="0.6" stroke-opacity="0.28"/>
  <!-- Iris (gold) -->
  <circle cx="41" cy="51" r="4.8" fill="#C5A059"/>
  <!-- Pupil (vertical slit — feline) -->
  <ellipse cx="41" cy="51" rx="1.8" ry="2.6" fill="#080C14"/>
  <!-- Inner iris ring (detail) -->
  <circle cx="41" cy="51" r="3.2" fill="none" stroke="#DDB870" stroke-width="0.4" stroke-opacity="0.5"/>
  <!-- Corneal specular highlight -->
  <circle cx="42.8" cy="49.2" r="1.1" fill="white" opacity="0.9"/>
  <!-- Micro light dot -->
  <circle cx="40.2" cy="52.8" r="0.4" fill="white" opacity="0.5"/>

  <!-- RIGHT EYE -->
  <circle cx="59" cy="51" r="7.5" fill="#B89450" fill-opacity="0.06" stroke="#B89450" stroke-width="0.6" stroke-opacity="0.28"/>
  <circle cx="59" cy="51" r="4.8" fill="#C5A059"/>
  <ellipse cx="59" cy="51" rx="1.8" ry="2.6" fill="#080C14"/>
  <circle cx="59" cy="51" r="3.2" fill="none" stroke="#DDB870" stroke-width="0.4" stroke-opacity="0.5"/>
  <circle cx="60.8" cy="49.2" r="1.1" fill="white" opacity="0.9"/>
  <circle cx="58.2" cy="52.8" r="0.4" fill="white" opacity="0.5"/>

  <!-- ════════════════════════════════════════
       NOSE & MUZZLE
  ════════════════════════════════════════ -->

  <!-- Nose (inverted triangle) -->
  <path d="M46.5 61.5 L50 66 L53.5 61.5 C51.5 58.5 48.5 58.5 46.5 61.5 Z" fill="#3A3A3A"/>
  <!-- Nose bridge highlight -->
  <line x1="50" y1="58" x2="50" y2="61" stroke="#4A4A4A" stroke-width="0.8"/>

  <!-- Muzzle area -->
  <ellipse cx="50" cy="66" rx="10" ry="8" fill="#1A1A20" opacity="0.65"/>

  <!-- Subtle mouth -->
  <path d="M44 69.5 Q47.5 72 50 70.5 Q52.5 72 56 69.5" stroke="#2A2A32" stroke-width="1.3" fill="none"/>

  <!-- ════════════════════════════════════════
       WHISKER PIXELS — digital style (square rects)
  ════════════════════════════════════════ -->
  <rect x="24" y="62"  width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.24"/>
  <rect x="27.5" y="66" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.17"/>
  <rect x="71.5" y="62" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.24"/>
  <rect x="68"   y="66" width="4.5" height="1.8" rx="0.5" fill="#B89450" opacity="0.17"/>

</svg>
