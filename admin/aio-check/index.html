title: "AIO構造スコアチェッカー"

<style>
/* AIO Tool — Dark Admin Theme Override */
.aio-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) { .aio-grid { grid-template-columns: 1fr; } }

.aio-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
}
.aio-panel__label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-sub); margin-bottom: 12px;
}
.aio-panel__title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.aio-panel__desc  { font-size: 12px; color: var(--text-sub); line-height: 1.6; margin-bottom: 18px; }

.aio-url-row { display: flex; gap: 8px; margin-bottom: 14px; }
.aio-url-input {
  flex: 1; padding: 9px 12px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--line);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font); font-size: 13px; outline: none;
  transition: border-color 0.2s;
}
.aio-url-input:focus { border-color: rgba(37,99,235,0.6); }
.aio-fetch-btn {
  padding: 9px 16px; background: var(--grad); border: none;
  border-radius: var(--radius); color: #fff;
  font-family: var(--font); font-size: 12px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
}
.aio-fetch-btn:hover { opacity: 0.85; }
.aio-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 0; color: var(--text-sub); font-size: 11px;
}
.aio-divider::before, .aio-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}
.aio-textarea {
  width: 100%; min-height: 200px; padding: 12px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--line);
  border-radius: var(--radius); color: var(--text);
  font-family: monospace; font-size: 12px; line-height: 1.6;
  resize: vertical; outline: none; box-sizing: border-box;
  transition: border-color 0.2s;
}
.aio-textarea:focus { border-color: rgba(37,99,235,0.5); }
.aio-analyze-btn {
  width: 100%; margin-top: 12px; padding: 12px;
  background: var(--grad); border: none; border-radius: var(--radius);
  color: #fff; font-family: var(--font); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity 0.2s; letter-spacing: 0.03em;
}
.aio-analyze-btn:hover { opacity: 0.88; }
.aio-msg {
  font-size: 11px; color: var(--text-sub); margin-top: 8px;
  min-height: 16px; text-align: center;
}
.aio-msg--error { color: var(--red); }
.aio-msg--loading { color: var(--cyan); }

/* Result */
.aio-result { position: sticky; top: 80px; }
.aio-score-box {
  background: #0D0D14; border: 1px solid var(--line);
  border-radius: var(--radius); padding: 24px; margin-bottom: 16px; text-align: center;
}
.aio-score-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--text-sub); margin-bottom: 16px;
}
.aio-gauge-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 14px; }
.aio-gauge-svg { width: 140px; height: 140px; transform: rotate(-90deg); }
.aio-gauge-bg   { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 10; }
.aio-gauge-fill {
  fill: none; stroke-width: 10; stroke-linecap: round;
  stroke-dasharray: 357; stroke-dashoffset: 357;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.16,1,0.3,1);
}
.aio-gauge-num {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.aio-gauge-num__score {
  font-size: 38px; font-weight: 700; line-height: 1;
  background: var(--grad); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text;
}
.aio-gauge-num__max { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.aio-grade { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.aio-grade-msg { font-size: 11px; color: var(--text-sub); }

.aio-breakdown {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.aio-cat { margin-bottom: 12px; }
.aio-cat:last-child { margin-bottom: 0; }
.aio-cat__row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.aio-cat__name { font-size: 12px; font-weight: 600; color: var(--text); }
.aio-cat__pts  { font-size: 11px; color: var(--text-sub); }
.aio-bar-track { height: 3px; background: rgba(255,255,255,0.08); border-radius: 100px; overflow: hidden; }
.aio-bar-fill  {
  height: 100%; border-radius: 100px; background: var(--grad);
  width: 0%; transition: width 1s cubic-bezier(0.16,1,0.3,1);
}

.aio-feedback {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px;
}
.aio-feedback-list { list-style: none; padding: 0; margin: 0; }
.aio-feedback-item {
  display: flex; gap: 8px; font-size: 12px; color: var(--text-sub);
  line-height: 1.6; padding: 9px 0; border-bottom: 1px solid var(--line);
}
.aio-feedback-item:last-child { border-bottom: none; }
.aio-fi-icon {
  flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; margin-top: 2px;
}
.aio-fi-icon--warn { background: rgba(245,158,11,0.15); color: var(--yellow); }
.aio-fi-icon--ok   { background: rgba(16,185,129,0.12); color: var(--green); }
.aio-placeholder {
  text-align: center; padding: 30px 16px;
  color: var(--text-sub); font-size: 12px; line-height: 1.8;
}
</style>

<div class="aio-grid">

  <!-- Input Panel -->
  <div class="aio-panel">
    <p class="aio-panel__label">Step 1 — Input</p>
    <h2 class="aio-panel__title">解析対象を指定する</h2>
    <p class="aio-panel__desc">URLからllms.txtを取得するか、テキストを直接貼り付けて解析します。</p>

    <div class="aio-url-row">
      <input type="url" class="aio-url-input" id="aio-url-input"
        placeholder="https://example.com" value="https://regalis-order-suits.com">
      <button class="aio-fetch-btn" id="aio-fetch-btn">取得→解析</button>
    </div>

    <div class="aio-divider">または llms.txt を直接貼り付け</div>

    <textarea class="aio-textarea" id="aio-text-input"
      placeholder="# サイト名&#10;&#10;&gt; サイトの説明...&#10;&#10;## セクション&#10;- [ページ](URL): 説明"></textarea>

    <button class="aio-analyze-btn" id="aio-analyze-btn">解析 — AIOスコアを算出</button>
    <p class="aio-msg" id="aio-msg"></p>
  </div>

  <!-- Result Panel -->
  <div class="aio-result">
    <div class="aio-score-box">
      <p class="aio-score-label">Regalis AIO Score™</p>
      <div class="aio-gauge-wrap">
        <svg class="aio-gauge-svg" viewBox="0 0 140 140">
          <circle class="aio-gauge-bg" cx="70" cy="70" r="57"/>
          <circle class="aio-gauge-fill" id="aio-gauge-fill" cx="70" cy="70" r="57"/>
        </svg>
        <div class="aio-gauge-num">
          <span class="aio-gauge-num__score" id="aio-score-num">—</span>
          <span class="aio-gauge-num__max">/ 100</span>
        </div>
      </div>
      <p class="aio-grade" id="aio-grade">解析待ち</p>
      <p class="aio-grade-msg" id="aio-grade-msg">URLまたはテキストを入力してください</p>
    </div>

    <div class="aio-breakdown">
      <p class="a-card__label">Score Breakdown</p>
      <div id="aio-breakdown-inner">
        <div class="aio-placeholder">解析後にカテゴリ別スコアが表示されます</div>
      </div>
    </div>

    <div class="aio-feedback">
      <p class="a-card__label">Optimization Advice</p>
      <div id="aio-feedback-inner">
        <div class="aio-placeholder">解析後に最適化アドバイスが表示されます</div>
      </div>
    </div>
  </div>

</div>

<script>
const CATS = [
  { id:'volume',     name:'情報量・網羅性',    max:25 },
  { id:'structure',  name:'構造化・見出し設計', max:25 },
  { id:'lists',      name:'リスト化・可読性',   max:20 },
  { id:'definition', name:'定義・断定型表現',   max:20 },
  { id:'links',      name:'リンク・参照性',     max:10 },
];

function analyzeText(text) {
  const h1  = (text.match(/^#\s+[^\n]+/gm)||[]).length;
  const h2  = (text.match(/^##\s+[^\n]+/gm)||[]).length;
  const h3  = (text.match(/^###\s+[^\n]+/gm)||[]).length;
  const li  = (text.match(/^[-*+]\s+/gm)||[]).length;
  const tr  = (text.match(/^\|.+\|$/gm)||[]).length;
  const lk  = (text.match(/\[.+?\]\(.+?\)/g)||[]).length;
  const df  = (text.match(/(とは|について|特徴は|料金は|概要|説明).{0,60}(です|ます|なります)/g)||[]).length;
  const fp  = (text.match(/\*\*.+\*\*[：:].+/g)||[]).length;
  const hasMVV     = /Mission|Vision|Value/i.test(text);
  const hasPrice   = /¥[\d,]+|円\/月|月額|料金/i.test(text);
  const hasContact = /contact|お問い合わせ|相談/i.test(text);
  const hasKF      = /Key\s*Facts|基本情報|会社情報/i.test(text);
  const c = text.length;

  let vol=0, str=0, lst=0, def=0, lnk=0;
  if(c>=3000)vol+=15; else if(c>=1500)vol+=10; else if(c>=500)vol+=5;
  if(h2>=5)vol+=5; else if(h2>=3)vol+=3;
  if(hasPrice)vol+=2; if(/東京/.test(text))vol+=1; if(/20\d\d/.test(text))vol+=2;
  vol=Math.min(vol,25);
  if(h1===1)str+=12; else if(h1>1)str+=4;
  if(h2>=4)str+=10; else if(h2>=2)str+=6; else if(h2>=1)str+=3;
  if(h3>=2)str+=2; if(hasMVV)str+=1; str=Math.min(str,25);
  if(li>=15)lst+=14; else if(li>=8)lst+=10; else if(li>=4)lst+=6; else if(li>=1)lst+=2;
  if(tr>=5)lst+=4; else if(tr>=2)lst+=2; if(fp>=5)lst+=2; lst=Math.min(lst,20);
  if(df>=5)def+=14; else if(df>=3)def+=10; else if(df>=1)def+=5;
  if(fp>=8)def+=4; else if(fp>=4)def+=2; if(hasKF)def+=2; def=Math.min(def,20);
  if(lk>=15)lnk+=8; else if(lk>=8)lnk+=6; else if(lk>=4)lnk+=4; else if(lk>=1)lnk+=2;
  if(hasContact)lnk+=2; lnk=Math.min(lnk,10);

  const cats={volume:vol,structure:str,lists:lst,definition:def,links:lnk};
  const total=Object.values(cats).reduce((a,b)=>a+b,0);

  const warns=[], oks=[];
  if(c<500)warns.push('文字数が不足（'+c+'文字）。500文字以上推奨。');
  else oks.push('情報量は十分（'+c.toLocaleString()+'文字）。');
  if(h1===0)warns.push('H1見出し（# タイトル）がありません。');
  else if(h1>1)warns.push('H1が'+h1+'個あります。1つに絞ることを推奨。');
  else oks.push('H1見出しが正しく1つ設定されています。');
  if(h2<2)warns.push('H2セクションが不足（'+h2+'個）。情報を区分してください。');
  if(li<4)warns.push('箇条書きが少ない（'+li+'個）。リスト形式を増やしてください。');
  else oks.push('箇条書きが十分（'+li+'個）。');
  if(df<2)warns.push('定義型表現「〜とは〜です」が少ないです。断定的な表現を増やしてください。');
  if(lk<4)warns.push('Markdownリンクが少ない（'+lk+'個）。主要ページへのリンクを追加。');
  else oks.push('Markdownリンクが十分（'+lk+'個）。');
  if(!hasPrice)warns.push('料金情報がありません。AIが価格を回答できるよう追加しましょう。');
  if(!hasMVV)warns.push('Mission/Vision/Valueが記載されていません。');
  if(!hasContact)warns.push('お問い合わせ情報がありません。');

  return {total,cats,warns,oks,metrics:{c,h1,h2,li,lk,df,tr}};
}

function getGrade(s) {
  if(s>=90)return{label:'Excellent',msg:'AIに最も引用されやすい構造です'};
  if(s>=75)return{label:'Good',     msg:'AIに選ばれやすい良好な構造です'};
  if(s>=55)return{label:'Fair',     msg:'改善の余地があります'};
  if(s>=35)return{label:'Poor',     msg:'AIに読まれにくい構造です'};
  return         {label:'Critical', msg:'早急な改善が必要です'};
}

function render(result) {
  const {total,cats,warns,oks} = result;
  const grade = getGrade(total);
  document.getElementById('aio-score-num').textContent = total;
  document.getElementById('aio-grade').textContent = grade.label;
  document.getElementById('aio-grade-msg').textContent = grade.msg;

  const c = 2*Math.PI*57; // circumference ≈ 358
  const fill = document.getElementById('aio-gauge-fill');
  fill.style.strokeDasharray = c;
  fill.style.strokeDashoffset = c * (1 - total/100);
  if (!fill.closest('svg').querySelector('defs')) {
    fill.closest('svg').insertAdjacentHTML('afterbegin',
      `<defs><linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#06B6D4"/>
      </linearGradient></defs>`);
  }
  fill.style.stroke = 'url(#ag)';

  document.getElementById('aio-breakdown-inner').innerHTML = CATS.map(cat=>{
    const pts=cats[cat.id]||0, pct=(pts/cat.max)*100;
    return `<div class="aio-cat">
      <div class="aio-cat__row">
        <span class="aio-cat__name">${cat.name}</span>
        <span class="aio-cat__pts">${pts}/${cat.max}</span>
      </div>
      <div class="aio-bar-track">
        <div class="aio-bar-fill" data-pct="${pct}" style="width:0%"></div>
      </div></div>`;
  }).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('.aio-bar-fill').forEach(el=>{ el.style.width=el.dataset.pct+'%'; });
  });

  let html='';
  warns.forEach(t=>{ html+=`<li class="aio-feedback-item"><span class="aio-fi-icon aio-fi-icon--warn">!</span><span>${t}</span></li>`; });
  oks.forEach(t=>  { html+=`<li class="aio-feedback-item"><span class="aio-fi-icon aio-fi-icon--ok">✓</span><span>${t}</span></li>`; });
  document.getElementById('aio-feedback-inner').innerHTML = `<ul class="aio-feedback-list">${html}</ul>`;
}

function setMsg(t,type) {
  const el=document.getElementById('aio-msg');
  el.textContent=t; el.className='aio-msg'+(type?' aio-msg--'+type:'');
}

document.getElementById('aio-analyze-btn').addEventListener('click',()=>{
  const text=document.getElementById('aio-text-input').value.trim();
  if(!text){setMsg('テキストを入力してください','error');return;}
  render(analyzeText(text)); setMsg('解析完了（テキスト入力）');
});

document.getElementById('aio-fetch-btn').addEventListener('click', async()=>{
  const raw=document.getElementById('aio-url-input').value.trim();
  if(!raw){setMsg('URLを入力してください','error');return;}
  let base;
  try{ base=new URL(raw.startsWith('http')?raw:'https://'+raw).origin; }
  catch{ setMsg('有効なURLを入力してください','error');return; }
  setMsg('取得中... '+base+'/llms.txt','loading');
  try{
    const res=await fetch(base+'/llms.txt',{mode:'cors'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    document.getElementById('aio-text-input').value=text;
    render(analyzeText(text)); setMsg('解析完了（'+base+'/llms.txt）');
  }catch(e){
    if(base===window.location.origin||raw.includes('regalis-order-suits.com')){
      const r=await fetch('/llms.txt'); const t=await r.text();
      document.getElementById('aio-text-input').value=t;
      render(analyzeText(t)); setMsg('解析完了（当サイト /llms.txt）');
    } else { setMsg('CORSエラー: テキストを直接貼り付けてください。','error'); }
  }
});

// Auto-analyze own site
(async()=>{
  try{
    const r=await fetch('/llms.txt'); const text=await r.text();
    document.getElementById('aio-text-input').value=text;
    render(analyzeText(text)); setMsg('当サイトの /llms.txt を自動解析しました');
  }catch(e){ setMsg('自動取得に失敗しました。テキストを貼り付けて解析してください。'); }
})();
</script>
