---
layout: null
title: "Admin Login"
---
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalis Admin — ログイン</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0A0F; --bg-card: #16161E; --line: rgba(255,255,255,0.08);
      --text: #E8E8F0; --text-sub: rgba(232,232,240,0.5);
      --blue: #2563EB; --cyan: #06B6D4;
      --grad: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      --red: #EF4444; --green: #10B981;
      --font: 'Inter', sans-serif; --radius: 6px;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 24px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-brand__logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .login-brand__sub {
      font-size: 13px;
      color: var(--text-sub);
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
    }
    .login-card__title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-card__sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 28px;
    }
    .login-field { margin-bottom: 16px; }
    .login-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    .login-input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .login-input:focus {
      border-color: rgba(37,99,235,0.6);
      background: rgba(37,99,235,0.06);
    }
    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--grad);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.03em;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--red);
      display: none;
    }
    .login-error.visible { display: block; }
    .login-loading {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--text-sub);
      display: none;
    }
    .login-loading.visible { display: block; }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .login-footer a { color: var(--text-sub); }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="login-brand__logo">Regalis Admin</div>
    <div class="login-brand__sub">管理者専用システム</div>
  </div>

  <div class="login-card">
    <div class="login-card__title">ログイン</div>
    <div class="login-card__sub">管理者パスワードを入力してください</div>

    <form id="login-form" autocomplete="off">
      <div class="login-field">
        <label class="login-label" for="password">パスワード</label>
        <input type="password" id="password" class="login-input"
          placeholder="••••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">
        ログイン
      </button>
    </form>

    <div class="login-loading" id="login-loading">認証中...</div>
    <div class="login-error" id="login-error">
      パスワードが正しくありません。
    </div>
  </div>

  <div class="login-footer">
    <a href="{{ '/' | relative_url }}">← サイトトップに戻る</a>
  </div>
</div>

<script>
const STORED_HASH = "{{ site.data.admin.password_hash }}";
const SESSION_KEY = "{{ site.data.admin.session_key }}";

// Already logged in → redirect
if (sessionStorage.getItem(SESSION_KEY) === STORED_HASH) {
  const next = new URLSearchParams(window.location.search).get('next') || '/admin/';
  window.location.replace(next);
}

async function sha256(message) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(message));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const loading = document.getElementById('login-loading');
  const error = document.getElementById('login-error');
  const pw = document.getElementById('password').value;

  btn.disabled = true;
  loading.classList.add('visible');
  error.classList.remove('visible');

  // Small delay for UX
  await new Promise(r => setTimeout(r, 400));

  const hash = await sha256(pw);

  if (hash === STORED_HASH) {
    sessionStorage.setItem(SESSION_KEY, hash);
    const next = new URLSearchParams(window.location.search).get('next') || '/admin/';
    window.location.replace(next);
  } else {
    loading.classList.remove('visible');
    error.classList.add('visible');
    btn.disabled = false;
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});
</script>

</body>
</html>
