# ────────────────────────────────────────────────────────────────
# コンテンツ安全ルール（広報・情報解禁制御）
#
# ブログ／ニュース／メタデータの公開前チェックに使用する。
#   npm run check:content        … src/content 全体をスキャン
#   scripts/auto_blog.js         … AI下書き生成時に自動でこのルールを適用
#
# 方針:
#   hard_block        … 検出時点で公開不可（ビルド／生成を停止）
#   needs_legal_review … 下書き保存は可。公開前に法務・登記確認が必須
#   risky_claim       … 誇張・断定表現。書き換えまたはレビュー必須
# ────────────────────────────────────────────────────────────────

# 検出時点で公開不可（登記前の確定情報・投資家・契約・技術仕様・私的チャネル）
hard_block:
  - "登記申請中"
  - "司法書士確認前"
  - "法務確認前"
  - "みなし決議"
  - "319条"
  - "株主総会議事録"
  - "取締役決定書"
  - "払込証明"
  - "資本準備金"
  - "募集株式"
  - "割当先"
  - "第三者割当"
  - "普通株式556株"
  - "1株18,000円"
  - "10,008,000円"
  - "5,004,000円"
  - "U25ファンド2026"
  - "平川凛乃丞"
  - "平川 凛乃丞"
  - "J-KISS"
  - "ポストバリュー"
  - "プレバリュー"
  - "NDA"
  - "秘密保持契約"
  - "契約書ドラフト"
  - "リーガルチェック"
  - "検収条件"
  - "RFP"
  - "LOI"
  - "Qualified Pipeline"
  - "ミーティングID"
  - "パスコード"
  - "Zoom URL"
  - "APIエンドポイント"
  - "POST /v1"
  - "GET /v1"
  - "X-Adctor"
  - "HMAC"
  - "nonce"
  - "ed25519"
  - "Secret Manager"
  - "citation_token"
  - "usage_event_id"
  - "buyer_id"
  - "license_id"
  - "api_key_id"

# 下書き保存は可・公開前に法務／登記／本人確認が必要
needs_legal_review:
  - "商号変更"
  - "増資"
  - "資金調達"
  - "新任取締役"
  - "役員変更"
  - "資本金"
  - "業界初"
  - "日本初"
  - "国内初"
  - "世界初"
  - "特許取得"
  - "特許出願"
  - "導入実績"
  - "顧客事例"

# 誇張・断定表現（書き換えまたはレビュー必須）
risky_claim:
  - "100%識別"
  - "完全自動課金"
  - "自動徴収"
  - "即時決済"
  - "必ず収益化"
  - "必ず上位表示"
  - "問い合わせ数を保証"
  - "CV保証"
  - "売上保証"
  - "SEO影響ゼロ"
  - "SEO影響はありません"
  - "引用されたら自動課金"
  - "完全自動で収益化"
