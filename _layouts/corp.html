  <!-- Page Transition CSS -->

  <!-- Custom Cursor CSS -->
  <style>
  .corp-cursor-dot,
  .corp-cursor-ring {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    will-change: transform;
    transition: opacity 0.3s;
  }
  .corp-cursor-dot {
    width: 7px; height: 7px;
    background: #2563EB;
  }
  .corp-cursor-ring {
    width: 38px; height: 38px;
    border: 1.5px solid rgba(37,99,235,0.4);
    background: rgba(37,99,235,0.05);
    transition: width 0.18s var(--ease-out), height 0.18s var(--ease-out),
                border-color 0.18s, opacity 0.3s;
  }
  .corp-cursor-ring.is-link {
    width: 56px; height: 56px;
    border-color: #2563EB;
    background: rgba(37,99,235,0.08);
  }
  .corp-cursor-dot.is-hidden,
  .corp-cursor-ring.is-hidden { opacity: 0; }
  @media (hover: none), (pointer: coarse) {
    .corp-cursor-dot, .corp-cursor-ring { display: none; }
  }
  </style>

  <!-- Page Transition JS -->
  <script>
  (function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var KEY = 'rjg-pt';
    var ss = {
      get: function(k) { try { return sessionStorage.getItem(k); } catch(e) { return null; } },
      set: function(k,v){ try { sessionStorage.setItem(k,v); } catch(e) {} },
      del: function(k)  { try { sessionStorage.removeItem(k); } catch(e) {} }
    };

    var COVER_MS  = 460;
    var NAV_MS    = 500;
    var REVEAL_MS = 480;

    document.addEventListener('DOMContentLoaded', function() {
      var pt   = document.getElementById('corp-pt');
      var bg   = document.getElementById('corp-pt-bg');
      var bar  = document.getElementById('corp-pt-bar');
      var logo = document.getElementById('corp-pt-inner');
      if (!pt || !bg || !logo) return;

      var navigating = false;

      function reset() {
        bg.style.cssText   = '';
        logo.style.cssText = '';
        bar.style.cssText  = '';
        pt.style.pointerEvents = 'none';
      }

      function cover(onNav) {
        pt.style.pointerEvents = 'auto';
        bg.style.transition    = 'none';
        bg.style.transformOrigin = 'left';
        bg.style.transform     = 'scaleX(0)';
        logo.style.transition  = 'none';
        logo.style.opacity     = '0';
        bar.style.width = '0'; bar.style.opacity = '1';

        requestAnimationFrame(function() {
          bg.style.transition = 'transform ' + COVER_MS + 'ms cubic-bezier(0.77,0,0.18,1)';
          bg.style.transform  = 'scaleX(1)';

          bar.style.transition = 'width ' + NAV_MS + 'ms cubic-bezier(0.4,0,0.6,1)';
          bar.style.width = '100%';

          setTimeout(function() {
            logo.style.transition = 'opacity 0.22s ease';
            logo.style.opacity    = '1';
          }, Math.round(COVER_MS * 0.52));

          if (onNav) setTimeout(onNav, NAV_MS);
        });
      }

      function reveal(onDone) {
        bg.style.transition      = 'none';
        bg.style.transformOrigin = 'right';
        bg.style.transform       = 'scaleX(1)';
        logo.style.transition    = 'none';
        logo.style.opacity       = '1';
        bar.style.width = '100%'; bar.style.opacity = '1';
        pt.style.pointerEvents   = 'none';

        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            logo.style.transition = 'opacity 0.15s ease';
            logo.style.opacity    = '0';
            bar.style.transition  = 'opacity 0.15s ease';
            bar.style.opacity     = '0';

            setTimeout(function() {
              bg.style.transition = 'transform ' + REVEAL_MS + 'ms cubic-bezier(0.77,0,0.18,1)';
              bg.style.transform  = 'scaleX(0)';
            }, 80);

            if (onDone) setTimeout(onDone, 80 + REVEAL_MS + 40);
          });
        });
      }

      var pending = ss.get(KEY) === '1';
      if (pending) { ss.del(KEY); reveal(reset); }
      else { reset(); }

      document.querySelectorAll('a[href]').forEach(function(link) {
        try {
          var href = link.getAttribute('href') || '';
          if (!href || href.charAt(0) === '#') return;
          if (/^(mailto:|tel:)/.test(href)) return;
          if (link.target === '_blank') return;
          var url = new URL(link.href, location.origin);
          if (url.origin !== location.origin) return;
        } catch(e) { return; }

        link.addEventListener('click', function(e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault();
          if (navigating) return;
          navigating = true;
          ss.set(KEY, '1');
          var dest = link.href;
          cover(function() { location.href = dest; });
        });
      });

      window.addEventListener('pageshow', function(e) {
        if (e.persisted) { navigating = false; ss.del(KEY); reset(); }
      });
      window.addEventListener('pagehide', function() { navigating = false; });
    });
  })();
  </script>

  <!-- Custom Cursor JS -->
  <script>
  (function(){
    var dot  = document.getElementById('corpCursorDot');
    var ring = document.getElementById('corpCursorRing');
    if (!dot || !ring) return;
    // Touch detection — hide on touch devices
    if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
    var mx = 0, my = 0, rx = 0, ry = 0;
    var ease = 0.14;
    var raf;
    function render() {
      rx += (mx - rx) * ease;
      ry += (my - ry) * ease;
      dot.style.transform  = 'translate3d(' + mx + 'px,' + my + 'px,0) translate(-50%,-50%)';
      ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0) translate(-50%,-50%)';
      raf = requestAnimationFrame(render);
    }
    render();
    document.addEventListener('mousemove', function(e){
      mx = e.clientX; my = e.clientY;
      dot.classList.remove('is-hidden');
      ring.classList.remove('is-hidden');
    });
    document.addEventListener('mouseleave', function(){
      dot.classList.add('is-hidden');
      ring.classList.add('is-hidden');
    });
    document.querySelectorAll('a, button').forEach(function(el){
      el.addEventListener('mouseenter', function(){ ring.classList.add('is-link'); });
      el.addEventListener('mouseleave', function(){ ring.classList.remove('is-link'); });
    });
  })();
  </script>

</body>
