<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.meta_title %}{{ page.meta_title }}{% else %}{{ page.title }} | Regalis Japan Group株式会社{% endif %}</title>
  <meta name="description" content="{{ page.description | default: 'レガリスジャパングループは、運用できていない自社メディアを運用、AI自動化、SEO/AIO設計に伴奏します。まずはメディア制作実績ご覧ください。' }}">

  <!-- OGP -->
  <meta property="og:title" content="{% if page.meta_title %}{{ page.meta_title }}{% else %}{{ page.title }} | レガリスジャパングループ{% endif %}">
  <meta property="og:description" content="{{ page.description | default: 'レガリスジャパングループは、運用できていない自社メディアを運用、AI自動化、SEO/AIO設計に伴奏します。まずはメディア制作実績ご覧ください。' }}">
  <meta property="og:type" content="{% if page.og_type %}{{ page.og_type }}{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.og_image | default: '/images/Brand-Cover.png' | absolute_url }}">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="Regalis Japan Group株式会社">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Canonical -->
  <link rel="canonical" href="{% if page.canonical %}{{ page.canonical }}{% else %}{{ page.url | absolute_url }}{% endif %}">

  <!-- Fonts (async to avoid render-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/corp.css' | relative_url }}?v=5">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="192x192" href="{{ '/favicon-192.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="144x144" href="{{ '/favicon-144.png' | relative_url }}">

  <!-- JSON-LD: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Regalis Japan Group株式会社",
    "alternateName": "Regalis Japan Group Co., Ltd.",
    "url": "{{ '/' | absolute_url }}",
    "logo": "{{ '/images/4.png' | absolute_url }}",
    "foundingDate": "2025-12-23",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "千代田区麹町",
      "addressRegion": "東京都",
      "postalCode": "102-0083",
      "addressCountry": "JP"
    },
    "sameAs": [
      "https://www.instagram.com/regalis.official.jp/"
    ],
    "member": {
      "@type": "Person",
      "name": "井上幹太",
      "alternateName": "Kanta Inoue",
      "jobTitle": "代表取締役CEO",
      "description": "14歳から独立したエンジニア・不登校からの起業家。ソフトバンクアカデミア17期、J-StarX（経済産業省 起業家育成プログラム）参加、令和の虎 Tiger Funding 1,500万円・2連続完全ALL獲得。ZEN大学1期特別奨学生。",
      "worksFor": {"@type": "Organization", "name": "Regalis Japan Group株式会社"},
      "sameAs": ["https://www.instagram.com/regalis.official.jp/"]
    }
  }
  </script>

  {% if page.jsonld %}{{ page.jsonld }}{% endif %}

  <!-- Page Transition CSS -->
  <style>
  #corp-pt {
    position: fixed; inset: 0;
    z-index: 9800;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #corp-pt-bg {
    position: absolute; inset: 0;
    background: #ffffff;
    transform: scaleX(0);
    transform-origin: left;
    will-change: transform;
    box-shadow: 4px 0 24px rgba(37,99,235,0.08);
  }
  #corp-pt-bar {
    position: absolute; bottom: 0; left: 0;
    height: 2px; width: 0; opacity: 0;
    background: linear-gradient(90deg, #2563EB 0%, #06B6D4 100%);
    z-index: 1;
  }
  #corp-pt-logo {
    position: relative; z-index: 2;
    height: 80px; width: auto;
    opacity: 0;
    will-change: opacity;
    margin-bottom: 20px;
  }
  </style>

  <!-- Custom Cursor CSS -->
  <style>
  .corp-cursor-dot,
  .corp-cursor-ring {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    will-change: transform;
    transition: opacity 0.3s;
  }
  .corp-cursor-dot {
    width: 7px; height: 7px;
    background: #2563EB;
  }
  .corp-cursor-ring {
    width: 38px; height: 38px;
    border: 1.5px solid rgba(37,99,235,0.4);
    background: rgba(37,99,235,0.05);
    transition: width 0.18s var(--ease-out), height 0.18s var(--ease-out),
                border-color 0.18s, opacity 0.3s;
  }
  .corp-cursor-ring.is-link {
    width: 56px; height: 56px;
    border-color: #2563EB;
    background: rgba(37,99,235,0.08);
  }
  .corp-cursor-dot.is-hidden,
  .corp-cursor-ring.is-hidden { opacity: 0; }
  @media (hover: none), (pointer: coarse) {
    .corp-cursor-dot, .corp-cursor-ring { display: none; }
  }
  </style>
</head>
<body class="corp-page">

  <!-- Page Transition Overlay -->
  <div id="corp-pt" aria-hidden="true">
    <div id="corp-pt-bg"></div>
    <div id="corp-pt-bar"></div>
    <img id="corp-pt-logo" src="{{ '/images/3.png' | relative_url }}" alt="" aria-hidden="true">
  </div>

  <!-- Custom cursor -->
  <div class="corp-cursor-dot" id="corpCursorDot" aria-hidden="true"></div>
  <div class="corp-cursor-ring" id="corpCursorRing" aria-hidden="true"></div>

  {% include corp-header.html %}

  <main>
    {{ content }}
  </main>

  {% include corp-footer.html %}

  <!-- Page Transition JS -->
  <script>
  (function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var KEY = 'rjg-pt';
    var ss = {
      get: function(k) { try { return sessionStorage.getItem(k); } catch(e) { return null; } },
      set: function(k,v){ try { sessionStorage.setItem(k,v); } catch(e) {} },
      del: function(k)  { try { sessionStorage.removeItem(k); } catch(e) {} }
    };

    var COVER_MS  = 460;
    var NAV_MS    = 500;
    var REVEAL_MS = 480;

    document.addEventListener('DOMContentLoaded', function() {
      var pt   = document.getElementById('corp-pt');
      var bg   = document.getElementById('corp-pt-bg');
      var bar  = document.getElementById('corp-pt-bar');
      var logo = document.getElementById('corp-pt-logo');
      if (!pt || !bg || !logo) return;

      var navigating = false;

      function reset() {
        bg.style.cssText   = '';
        logo.style.cssText = '';
        bar.style.cssText  = '';
        pt.style.pointerEvents = 'none';
      }

      function cover(onNav) {
        pt.style.pointerEvents = 'auto';
        bg.style.transition    = 'none';
        bg.style.transformOrigin = 'left';
        bg.style.transform     = 'scaleX(0)';
        logo.style.transition  = 'none';
        logo.style.opacity     = '0';
        bar.style.width = '0'; bar.style.opacity = '1';

        requestAnimationFrame(function() {
          bg.style.transition = 'transform ' + COVER_MS + 'ms cubic-bezier(0.77,0,0.18,1)';
          bg.style.transform  = 'scaleX(1)';

          bar.style.transition = 'width ' + NAV_MS + 'ms cubic-bezier(0.4,0,0.6,1)';
          bar.style.width = '100%';

          setTimeout(function() {
            logo.style.transition = 'opacity 0.22s ease';
            logo.style.opacity    = '1';
          }, Math.round(COVER_MS * 0.52));

          if (onNav) setTimeout(onNav, NAV_MS);
        });
      }

      function reveal(onDone) {
        bg.style.transition      = 'none';
        bg.style.transformOrigin = 'right';
        bg.style.transform       = 'scaleX(1)';
        logo.style.transition    = 'none';
        logo.style.opacity       = '1';
        bar.style.width = '100%'; bar.style.opacity = '1';
        pt.style.pointerEvents   = 'none';

        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            logo.style.transition = 'opacity 0.15s ease';
            logo.style.opacity    = '0';
            bar.style.transition  = 'opacity 0.15s ease';
            bar.style.opacity     = '0';

            setTimeout(function() {
              bg.style.transition = 'transform ' + REVEAL_MS + 'ms cubic-bezier(0.77,0,0.18,1)';
              bg.style.transform  = 'scaleX(0)';
            }, 80);

            if (onDone) setTimeout(onDone, 80 + REVEAL_MS + 40);
          });
        });
      }

      var pending = ss.get(KEY) === '1';
      if (pending) { ss.del(KEY); reveal(reset); }
      else { reset(); }

      document.querySelectorAll('a[href]').forEach(function(link) {
        try {
          var href = link.getAttribute('href') || '';
          if (!href || href.charAt(0) === '#') return;
          if (/^(mailto:|tel:)/.test(href)) return;
          if (link.target === '_blank') return;
          var url = new URL(link.href, location.origin);
          if (url.origin !== location.origin) return;
        } catch(e) { return; }

        link.addEventListener('click', function(e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault();
          if (navigating) return;
          navigating = true;
          ss.set(KEY, '1');
          var dest = link.href;
          cover(function() { location.href = dest; });
        });
      });

      window.addEventListener('pageshow', function(e) {
        if (e.persisted) { navigating = false; ss.del(KEY); reset(); }
      });
      window.addEventListener('pagehide', function() { navigating = false; });
    });
  })();
  </script>

  <!-- Custom Cursor JS -->
  <script>
  (function(){
    var dot  = document.getElementById('corpCursorDot');
    var ring = document.getElementById('corpCursorRing');
    if (!dot || !ring) return;
    // Touch detection — hide on touch devices
    if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
    var mx = 0, my = 0, rx = 0, ry = 0;
    var ease = 0.14;
    var raf;
    function render() {
      rx += (mx - rx) * ease;
      ry += (my - ry) * ease;
      dot.style.transform  = 'translate3d(' + mx + 'px,' + my + 'px,0) translate(-50%,-50%)';
      ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0) translate(-50%,-50%)';
      raf = requestAnimationFrame(render);
    }
    render();
    document.addEventListener('mousemove', function(e){
      mx = e.clientX; my = e.clientY;
      dot.classList.remove('is-hidden');
      ring.classList.remove('is-hidden');
    });
    document.addEventListener('mouseleave', function(){
      dot.classList.add('is-hidden');
      ring.classList.add('is-hidden');
    });
    document.querySelectorAll('a, button').forEach(function(el){
      el.addEventListener('mouseenter', function(){ ring.classList.add('is-link'); });
      el.addEventListener('mouseleave', function(){ ring.classList.remove('is-link'); });
    });
  })();
  </script>

</body>
</html>
