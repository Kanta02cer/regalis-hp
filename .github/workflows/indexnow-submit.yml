name: IndexNow submission after production deploy

on:
  workflow_run:
    workflows:
      - Deploy Jekyll site to GitHub Pages
    types:
      - completed
  workflow_dispatch:
    inputs:
      urls:
        description: '送信する公開URL（カンマ区切り、省略時は主要ページ）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://trillion-bank.jp
      INDEXNOW_KEY: b8f3e2d1c4a57690
      INDEXNOW_KEY_FILE: b8f3e2d1c4a57690.txt

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Build validated URL list
        id: urls
        env:
          MANUAL_URLS: ${{ inputs.urls }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          site = os.environ['SITE_URL'].rstrip('/')
          manual = os.environ.get('MANUAL_URLS', '').strip()
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          output = Path(os.environ['GITHUB_OUTPUT'])

          core_paths = {
              '/',
              '/trillionbank/business/',
              '/trillionbank/business/hack2/',
              '/trillionbank/business/pay-per-crawl/',
              '/trillionbank/company/',
              '/trillionbank/insights/',
              '/trillionbank/contact/',
          }
          noindex_paths = {
              '/trillionbank/business/ai-coupon/',
              '/trillionbank/business/dx-consulting/',
              '/trillionbank/business/media-operation/',
              '/trillionbank/business/sales-promotion/',
              '/trillionbank/business/student-ambassador/',
              '/trillionbank/business/web-development/',
          }

          paths = set()
          if manual:
              candidates = [part.strip() for part in manual.split(',') if part.strip()]
              for candidate in candidates:
                  parsed = urlparse(candidate)
                  if parsed.scheme != 'https' or parsed.netloc != 'trillion-bank.jp':
                      raise SystemExit(f'Only https://trillion-bank.jp URLs are allowed: {candidate}')
                  paths.add(parsed.path or '/')
          elif event == 'workflow_run':
              diff = subprocess.run(
                  ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
              shared_change = False
              for filename in diff:
                  if filename == 'index.html':
                      paths.add('/')
                  elif filename.startswith('_tbnews/') and filename.endswith('.md'):
                      slug = Path(filename).stem
                      if len(slug) > 11 and slug[4] == '-' and slug[7] == '-':
                          slug = slug[11:]
                      paths.add(f'/trillionbank/news/{slug}/')
                  elif filename.startswith('trillionbank/') and filename.endswith('/index.html'):
                      paths.add('/' + str(Path(filename).parent).replace('\\', '/') + '/')
                  elif filename.startswith(('_includes/', '_layouts/', '_data/', 'assets/', 'images/')) or filename == '_config.yml':
                      shared_change = True
              if shared_change:
                  paths.update(core_paths)
          else:
              paths.update(core_paths)

          paths.difference_update(noindex_paths)
          if not paths:
              paths.update(core_paths)

          urls = sorted({site + path for path in paths})
          if len(urls) > 10000:
              raise SystemExit('IndexNow accepts at most 10,000 URLs per request')

          with output.open('a', encoding='utf-8') as fh:
              fh.write('urls<<JSON\n')
              fh.write(json.dumps(urls, ensure_ascii=False))
              fh.write('\nJSON\n')
              fh.write(f'count={len(urls)}\n')

          print(f'Prepared {len(urls)} URL(s)')
          for url in urls:
              print(url)
          PY

      - name: Verify live ownership key and sitemap
        run: |
          set -euo pipefail
          key_body="$(curl --fail --silent --show-error --location --retry 3 --max-time 30 "$SITE_URL/$INDEXNOW_KEY_FILE")"
          if [[ "$key_body" != "$INDEXNOW_KEY" ]]; then
            echo "The live IndexNow ownership file does not match the configured key."
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            --output /dev/null "$SITE_URL/sitemap-index.xml"

      - name: Submit changed public URLs to IndexNow
        env:
          URLS_JSON: ${{ steps.urls.outputs.urls }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          urls = json.loads(os.environ['URLS_JSON'])
          payload = {
              'host': 'trillion-bank.jp',
              'key': os.environ['INDEXNOW_KEY'],
              'keyLocation': f"{os.environ['SITE_URL']}/{os.environ['INDEXNOW_KEY_FILE']}",
              'urlList': urls,
          }
          Path('/tmp/indexnow-payload.json').write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

          status="$(curl --silent --show-error --location \
            --retry 2 --retry-delay 3 --max-time 45 \
            --output /tmp/indexnow-response.txt --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json)"

          echo "IndexNow response: HTTP $status"
          if [[ "$status" != '200' && "$status" != '202' ]]; then
            cat /tmp/indexnow-response.txt
            exit 1
          fi

      - name: Write release summary
        run: |
          {
            echo '## IndexNow submission'
            echo
            echo "- Submitted URLs: ${{ steps.urls.outputs.count }}"
            echo '- Endpoint: api.indexnow.org'
            echo '- Ownership key: verified on the production domain'
            echo '- Sitemap: production sitemap-index.xml reachable'
            echo
            echo 'Google discovery is handled through the sitemap declared in robots.txt and Search Console; deprecated sitemap ping endpoints are not used.'
          } >> "$GITHUB_STEP_SUMMARY"
