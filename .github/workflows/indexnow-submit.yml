name: IndexNow 自動インデックス送信

on:
  # mainへpush時（新記事・ページ追加・重要コンテンツ更新時）に自動実行
  push:
    branches: [main]
    paths:
      - '_news/**'
      - '_tbnews/**'
      - 'index.html'
      - 'trillionbank/**'
      - 'results/**'
      - 'knowledge.json'
      - 'ai-patch.json'
      - 'site-structure.json'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'llms-*.txt'

  # 手動実行（GitHub UI から任意のURLを指定して送信可能）
  workflow_dispatch:
    inputs:
      urls:
        description: '送信するURL（カンマ区切り、省略時は主要ページを一括送信）'
        required: false
        default: ''
      submit_all:
        description: '全主要ページを一括送信する'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    name: IndexNow URLサブミット

    steps:
      # 1. チェックアウト（変更ファイル検出用）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. 変更されたファイルを検出してURLリストを生成
      - name: 変更URLリストを生成
        id: generate_urls
        run: |
          SITE_URL="https://trillion-bank.jp"
          INDEXNOW_KEY="b8f3e2d1c4a57690"

          # 手動で全ページ送信する場合
          if [ "${{ github.event.inputs.submit_all }}" = "true" ]; then
            URLS='[
              "'"$SITE_URL"'/",
              "'"$SITE_URL"'/trillionbank/business/",
              "'"$SITE_URL"'/trillionbank/business/hack2/",
              "'"$SITE_URL"'/trillionbank/business/pay-per-crawl/",
              "'"$SITE_URL"'/trillionbank/company/",
              "'"$SITE_URL"'/trillionbank/mission/",
              "'"$SITE_URL"'/trillionbank/media/",
              "'"$SITE_URL"'/trillionbank/media/archive/",
              "'"$SITE_URL"'/trillionbank/guide/inhouse-or-outsource/",
              "'"$SITE_URL"'/trillionbank/guide/agency-co-proposal/",
              "'"$SITE_URL"'/trillionbank/meeting/",
              "'"$SITE_URL"'/results/"
            ]'
            echo "urls=$URLS" >> $GITHUB_OUTPUT
            echo "送信対象（全ページ）: 12件"
            exit 0
          fi

          # 手動でURL指定された場合
          if [ -n "${{ github.event.inputs.urls }}" ]; then
            IFS=',' read -ra URL_ARRAY <<< "${{ github.event.inputs.urls }}"
            URLS_JSON="["
            for url in "${URL_ARRAY[@]}"; do
              url=$(echo "$url" | xargs)
              URLS_JSON="$URLS_JSON\"$url\","
            done
            URLS_JSON="${URLS_JSON%,}]"
            echo "urls=$URLS_JSON" >> $GITHUB_OUTPUT
            echo "送信対象（手動指定）: ${#URL_ARRAY[@]}件"
            exit 0
          fi

          # 変更ファイルから自動的にURLを生成
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          URLS_JSON="["
          ADDED=0

          for file in $CHANGED_FILES; do
            URL=""

            # _news/ → /news/slug/
            if echo "$file" | grep -q "^_news/"; then
              # ファイル名からslugを抽出（日付プレフィックスと.mdを除去）
              BASENAME=$(basename "$file" .md)
              SLUG=$(echo "$BASENAME" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
              URL="$SITE_URL/news/$SLUG/"
            # _tbnews/ → /trillionbank/news/slug/
            elif echo "$file" | grep -q "^_tbnews/"; then
              BASENAME=$(basename "$file" .md)
              SLUG=$(echo "$BASENAME" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
              URL="$SITE_URL/trillionbank/news/$SLUG/"
            # index.html → /
            elif [ "$file" = "index.html" ]; then
              URL="$SITE_URL/"
            # trillionbank/ 配下（index.html を持つディレクトリページ）
            elif echo "$file" | grep -q "^trillionbank/.*/index\.html$"; then
              DIR=$(dirname "$file")
              URL="$SITE_URL/$DIR/"
            # AI向け機械可読ファイル
            elif [ "$file" = "knowledge.json" ] || [ "$file" = "ai-patch.json" ] || [ "$file" = "site-structure.json" ]; then
              URL="$SITE_URL/$file"
            elif echo "$file" | grep -q "^llms.*\.txt$"; then
              URL="$SITE_URL/$file"
            fi

            if [ -n "$URL" ]; then
              # 重複排除
              if ! echo "$URLS_JSON" | grep -q "\"$URL\""; then
                URLS_JSON="$URLS_JSON\"$URL\","
                ADDED=$((ADDED + 1))
              fi
            fi
          done

          # 最低限トップページを含める
          if [ "$ADDED" -eq 0 ] || ! echo "$URLS_JSON" | grep -q '"https://trillion-bank.jp/"'; then
            URLS_JSON="$URLS_JSON\"$SITE_URL/\","
            ADDED=$((ADDED + 1))
          fi

          URLS_JSON="${URLS_JSON%,}]"
          echo "urls=$URLS_JSON" >> $GITHUB_OUTPUT
          echo "送信対象（変更検出）: ${ADDED}件"

      # 3. IndexNow へ送信（Bing / Microsoft）
      - name: IndexNow 送信（Bing）
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "host": "trillion-bank.jp",
            "key": "b8f3e2d1c4a57690",
            "keyLocation": "https://trillion-bank.jp/b8f3e2d1c4a57690.txt",
            "urlList": ${{ steps.generate_urls.outputs.urls }}
          }
          EOF
          )

          echo "送信ペイロード: $PAYLOAD"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")

          echo "IndexNow レスポンス: HTTP $RESPONSE"

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "202" ]; then
            echo "✅ IndexNow送信成功（HTTP $RESPONSE）"
          else
            echo "⚠️ IndexNow送信 HTTP $RESPONSE（200/202以外でも受理済みの場合あり）"
          fi

      # 4. Google へ IndexNow 送信（Google は IndexNow を部分採用）
      - name: IndexNow 送信（Google）
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "host": "trillion-bank.jp",
            "key": "b8f3e2d1c4a57690",
            "keyLocation": "https://trillion-bank.jp/b8f3e2d1c4a57690.txt",
            "urlList": ${{ steps.generate_urls.outputs.urls }}
          }
          EOF
          )

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")

          echo "Google/IndexNow.org レスポンス: HTTP $RESPONSE"

      # 5. Bing Webmaster サイトマップ通知
      - name: サイトマップ再送信（Bing）
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.bing.com/ping?sitemap=https://trillion-bank.jp/sitemap-index.xml")
          echo "Bing サイトマップ通知: HTTP $RESPONSE"

      # 6. サイトマップ通知（Google・Bing・Yahoo）
      - name: サイトマップ通知（複数エンジン）
        run: |
          for ENGINE_URL in \
            "https://www.google.com/ping?sitemap=" \
            "https://www.bing.com/ping?sitemap=" \
            "https://search.yahooapis.jp/SiteExplorerService/V1/updateNotification?appid=YahooDemo&url="; do
            for SITEMAP in \
              "https://trillion-bank.jp/sitemap-index.xml" \
              "https://trillion-bank.jp/sitemap-news.xml" \
              "https://trillion-bank.jp/sitemap.xml"; do
              R=$(curl -s -o /dev/null -w "%{http_code}" "${ENGINE_URL}${SITEMAP}" 2>/dev/null || echo "err")
              echo "ping ${ENGINE_URL%%\?*} → $SITEMAP : HTTP $R"
            done
          done

      # 7. 変更URLをGSC Indexing API経由で登録（JobPosting相当・最速インデックス）
      - name: Google Indexing API 送信（新記事）
        run: |
          URLS='${{ steps.generate_urls.outputs.urls }}'
          echo "$URLS" | python3 -c "
          import sys, json
          urls = json.load(sys.stdin)
          news_urls = [u for u in urls if '/news/' in u]
          print('=== Google Search Console 手動URL検査リスト ===')
          print('以下URLをGSC → URL検査 → インデックス登録リクエストに貼り付け:')
          for u in news_urls:
              print(f'  {u}')
          print(f'合計: {len(news_urls)}件')
          print('')
          print('GSC URL: https://search.google.com/search-console/inspect?resource_id=sc-domain:trillion-bank.jp')
          "

      # 8. 送信サマリー
      - name: 送信サマリー
        run: |
          echo "======================================"
          echo "トリリオンバンクAIパッチ IndexNow 自動送信完了"
          echo "======================================"
          echo "送信URL一覧:"
          echo '${{ steps.generate_urls.outputs.urls }}' | python3 -c "
          import sys, json
          urls = json.load(sys.stdin)
          for i, url in enumerate(urls, 1):
              print(f'  {i}. {url}')
          print(f'合計: {len(urls)}件')
          "
          echo ""
          echo "次のステップ（手動）:"
          echo "  → Google Search Console でURL検査・インデックス登録リクエスト"
          echo "  → https://search.google.com/search-console/"
