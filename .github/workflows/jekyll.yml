name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: suit-mbti-app/package-lock.json

    - name: Build React App
      run: |
        cd suit-mbti-app
        npm ci
        npm run build

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.3'
        bundler-cache: true

    - name: Install Jekyll dependencies
      run: bundle install

    - name: Minify CSS
      run: |
        npm install -g clean-css-cli
        cleancss -o assets/css/main.min.css assets/css/main.css --level 2

    - name: Minify JavaScript
      run: |
        npm install -g terser
        terser assets/js/main.js -o assets/js/main.min.js -c -m --comments false

    - name: Optimize Images (WebP conversion)
      run: |
        # Install webp tools if available
        if command -v cwebp &> /dev/null; then
          # Convert PNG to WebP for ecosystem image if not exists
          if [ -f "images/Gemini_Generated_Image_dfwfbzdfwfbzdfwf.png" ] && [ ! -f "images/Gemini_Generated_Image_dfwfbzdfwfbzdfwf.webp" ]; then
            cwebp -q 85 "images/Gemini_Generated_Image_dfwfbzdfwfbzdfwf.png" -o "images/Gemini_Generated_Image_dfwfbzdfwfbzdfwf.webp"
            echo "Converted to WebP: Gemini_Generated_Image_dfwfbzdfwfbzdfwf.webp"
          fi
        else
          echo "cwebp not available, skipping WebP conversion"
        fi

    - name: Build Jekyll site
      run: bundle exec jekyll build

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
