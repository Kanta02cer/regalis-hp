name: Public llms files update

on:
  push:
    branches: [main]
    paths:
      - '_tbnews/**'
      - '_data/public_facts.yml'
      - 'tools/generate_llms.py'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print output without writing files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-llms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Generate public machine-readable files
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tools/generate_llms.py --dry-run
          else
            python tools/generate_llms.py
          fi
      - name: Commit generated changes
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt
          if git diff --staged --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh public llms indexes"
            git push
          fi
