name: Pull request site validation

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.md'
      - '_includes/**'
      - '_layouts/**'
      - '_data/**'
      - 'assets/**'
      - 'images/**'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'robots.txt'
      - 'feed.xml'
      - 'manifest.json'
      - 'sitemap*.xml'
      - 'llms*.txt'
      - 'knowledge.json'
      - 'site-structure.json'
      - 'ai-patch.json'
      - 'aio-scores.json'
      - 'scripts/site_smoke.mjs'
      - '.github/workflows/pr-site-validation.yml'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-site-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      BASE_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify required output and retired output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          required = [
              '_site/index.html',
              '_site/trillionbank/company/index.html',
              '_site/trillionbank/business/index.html',
              '_site/trillionbank/business/hack2/index.html',
              '_site/trillionbank/business/pay-per-crawl/index.html',
              '_site/trillionbank/insights/index.html',
              '_site/trillionbank/insights/editorial-policy/index.html',
              '_site/trillionbank/media/index.html',
              '_site/trillionbank/contact/index.html',
              '_site/trillionbank/meeting/index.html',
              '_site/trillionbank/privacy/index.html',
              '_site/trillionbank/terms/index.html',
              '_site/trillionbank/security/index.html',
              '_site/tokushoho.html',
              '_site/trillionbank/news/seo-aeo-geo-aio-llmo-difference/index.html',
              '_site/trillionbank/news/ai-search-measurement-method/index.html',
              '_site/trillionbank/news/pay-per-crawl-pay-per-use-difference/index.html',
              '_site/llms.txt',
              '_site/llms-full.txt',
              '_site/knowledge.json',
              '_site/site-structure.json',
              '_site/feed.xml',
              '_site/sitemap.xml',
              '_site/sitemap-index.xml',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit('Missing required output:\n- ' + '\n- '.join(missing))

          retired = [
              '_site/ai-patch.json',
              '_site/aio-scores.json',
              '_site/news/llms.txt',
              '_site/results/llms.txt',
              '_site/sitemap-news.xml',
              '_site/llms-aio.txt',
              '_site/llms-brand.txt',
              '_site/llms-chatgpt.txt',
              '_site/llms-claude.txt',
              '_site/llms-comparison.txt',
              '_site/llms-dx.txt',
              '_site/llms-enterprise.txt',
              '_site/llms-entity.txt',
              '_site/llms-facts.txt',
              '_site/llms-faq.txt',
              '_site/llms-gemini.txt',
              '_site/llms-local.txt',
              '_site/llms-talent.txt',
          ]
          present = [path for path in retired if Path(path).exists()]
          if present:
              raise SystemExit('Retired output must not be built:\n- ' + '\n- '.join(present))

          contact_path = Path('_data/contact.yml')
          if not contact_path.is_file():
              raise SystemExit('_data/contact.yml is missing')
          contact = contact_path.read_text(encoding='utf-8')
          for key in ('form_id', 'form_url', 'meeting_url'):
              if not re.search(rf'(?m)^{key}:\s*"?\S+', contact):
                  raise SystemExit(f'{key} is missing or empty in _data/contact.yml')
          for prohibited in ('email', 'cc'):
              if re.search(rf'(?m)^{prohibited}:', contact):
                  raise SystemExit(f'Public contact configuration must not contain {prohibited}')

          sitemap = Path('_site/sitemap.xml').read_text(encoding='utf-8')
          forbidden_refs = [
              '/ai-patch.json', '/results/', '/works/', '/download/', '/scan.html',
              '/scan-simulator.html', '/lp/hack2/founding-monitor/',
              '/trillionbank/media/archive/', '/trillionbank/ceo/', '/trillionbank/guide/',
              '/trillionbank/business/ai-coupon/', '/trillionbank/business/dx-consulting/',
              '/trillionbank/business/media-operation/', '/trillionbank/business/sales-promotion/',
              '/trillionbank/business/student-ambassador/', '/trillionbank/business/web-development/',
          ]
          bad_refs = [item for item in forbidden_refs if item in sitemap]
          if bad_refs:
              raise SystemExit('Sitemap contains retired routes:\n- ' + '\n- '.join(bad_refs))

          required_article_refs = [
              '/trillionbank/news/seo-aeo-geo-aio-llmo-difference/',
              '/trillionbank/news/ai-search-measurement-method/',
              '/trillionbank/news/pay-per-crawl-pay-per-use-difference/',
          ]
          absent_refs = [item for item in required_article_refs if item not in sitemap]
          if absent_refs:
              raise SystemExit('Sitemap is missing approved Insights:\n- ' + '\n- '.join(absent_refs))

          robots = Path('_site/robots.txt').read_text(encoding='utf-8')
          if 'sitemap-news.xml' in robots:
              raise SystemExit('robots.txt still references retired sitemap-news.xml')

          manifest = json.loads(Path('_site/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('name') != '株式会社Trillion Bank':
              raise SystemExit('manifest.json must use the exact legal name')

          feed = Path('_site/feed.xml').read_text(encoding='utf-8')
          if '株式会社トリリオンバンク' in feed or '<email>' in feed:
              raise SystemExit('feed.xml contains a non-legal company name or a public email field')

          print('Required output, retired output, sitemap and public contact checks passed')
          PY

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive browser smoke tests
        run: |
          mkdir -p artifacts/site-smoke
          python3 -m http.server 4000 --directory _site > /tmp/trillion-bank-site.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/ >/dev/null
          node scripts/site_smoke.mjs

      - name: Publish validation summary to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tb-site-smoke -->';
            const reportPath = 'artifacts/site-smoke/report.json';
            let body;

            if (!fs.existsSync(reportPath)) {
              body = `${marker}\n### Site validation could not produce a report\n\nThe build or browser setup failed before the report was written. Review the workflow log.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const passed = report.issueCount === 0;
              const heading = passed ? 'Site validation passed' : 'Site validation found blocking issues';
              const summary = passed
                ? `Jekyll build and ${report.results.length} responsive route/viewport checks passed.`
                : `${report.issueCount} issue(s) were found across ${report.results.length} responsive route/viewport checks.`;
              const findings = report.issues.slice(0, 40).map((issue) => {
                const detail = String(issue.detail || '').replace(/`/g, "'").replace(/\s+/g, ' ').trim();
                return `- **${issue.viewport}** \`${issue.route}\` — ${issue.type}: ${detail}`;
              });
              const truncated = report.issues.length > findings.length
                ? `\n- …and ${report.issues.length - findings.length} more issue(s). See the uploaded report artifact.`
                : '';
              body = `${marker}\n### ${heading}\n\n${summary}\n\n${findings.length ? findings.join('\n') + truncated : 'No blocking findings.'}\n\nScreenshots and the JSON report are attached to the workflow run artifact.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/site-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload built site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site-${{ github.event.pull_request.number || github.run_number }}
          path: _site
          retention-days: 7
