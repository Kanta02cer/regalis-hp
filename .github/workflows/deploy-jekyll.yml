name: Deploy Jekyll to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: suit-mbti-app/package-lock.json

      - name: Build React App
        run: |
          cd suit-mbti-app
          npm ci
          npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      # --- Regalis Japan Group corporate site at /group ---
      - name: Checkout regalis-japan-group
        uses: actions/checkout@v4
        with:
          repository: Kanta02cer/regalis-japan-group
          path: corporate-site

      - name: Install corporate site dependencies
        run: |
          cd corporate-site
          bundle install

      - name: Build corporate site to /group subdirectory
        run: |
          cd corporate-site
          JEKYLL_ENV=production bundle exec jekyll build \
            --config _config.yml,_config.group.yml \
            --destination ../_site/group
      # ---------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
