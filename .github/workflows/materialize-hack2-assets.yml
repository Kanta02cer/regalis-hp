name: Materialize Hack2 LP visual assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-hack2-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hack2-lp-visual-assets
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download generated WebP blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/lp/hack2/founding-monitor assets/css assets/js

          download_blob() {
            local sha="$1"
            local destination="$2"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' \
              | tr -d '\n' \
              | base64 --decode > "${destination}"
            test -s "${destination}"
            file "${destination}" | grep -q 'Web/P image'
          }

          download_blob 8c711cc5e38e51dbdcb99250d544053145e017c2 images/lp/hack2/founding-monitor/hero.webp
          download_blob 6e94817457e2e75d5ee2f12ee009f38e7b03b698 images/lp/hack2/founding-monitor/ai-visibility.webp
          download_blob 4aa88171f846f18452e988335f4db7a3b53070fa images/lp/hack2/founding-monitor/competitor.webp
          download_blob f0492e171c305a25713a6c9ba5a1f08ac5ff2e18 images/lp/hack2/founding-monitor/plan-90days.webp
          download_blob 9ed06f78d635f2278fa6bd489a986745a146f0f4 images/lp/hack2/founding-monitor/url-cta.webp
          download_blob 5e29cae30f7ffe2714333587689b88fb21a0692e images/lp/hack2/founding-monitor/founding-badge.webp
          download_blob f32afab66bb8701ad2ed79ab8524ec1e216014f5 images/lp/hack2/founding-monitor/mascot-cta.webp
          download_blob 50f21d604e6a0dfaad4b0cfe8714b13a4b3c655a images/lp/hack2/founding-monitor/application-flow.webp
          download_blob db84a0e8915ea696e61f5764b95f166746d91556 images/lp/hack2/founding-monitor/dashboard.webp
          download_blob 484da8fcb0fa7effbe348e1e2f0c694bc6095994 images/lp/hack2/founding-monitor/mobile-hero.webp

      - name: Write LP-only styles
        shell: bash
        run: |
          cat > assets/css/hack2-founding-monitor-visuals.css <<'EOF'
          /* Hack II Founding Monitor LP: generated visual assets */
          .lp-hero .lp-wrap{position:relative}
          .lp-visual{max-width:920px;margin:clamp(26px,5vw,48px) auto 0}
          .lp-visual__frame{margin:0}
          .lp-visual img{display:block;width:100%;height:auto;border:1px solid var(--lp-border);border-radius:16px;background:#fff;box-shadow:0 18px 44px rgba(15,23,42,.10)}
          .lp-visual__caption{margin:12px 0 0;color:var(--lp-muted);font-size:.78rem;line-height:1.7;text-align:center}
          .lp-visual--hero{max-width:1040px}
          .lp-visual--hero img{border-color:rgba(37,99,235,.14);border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.16)}
          .lp-visual--square{max-width:560px}
          .lp-visual--portrait{max-width:540px}
          .lp-visual--flow{margin-bottom:34px}
          .lp-visual--mobile-only{display:none}
          .lp-founding-badge{position:absolute;z-index:2;right:-54px;top:-48px;width:clamp(92px,11vw,138px);height:auto;pointer-events:none;filter:drop-shadow(0 14px 22px rgba(15,23,42,.18))}
          .lp-cta-visual-link{display:block;max-width:900px;margin:22px auto 0;border-radius:14px;text-decoration:none;overflow:hidden;box-shadow:0 16px 36px rgba(15,23,42,.12)}
          .lp-cta-visual-link:focus-visible{outline:3px solid var(--lp-blue);outline-offset:5px}
          .lp-cta-visual-link img{display:block;width:100%;height:auto;border:0}
          .lp-screen>.lp-visual--dashboard{max-width:none;margin:0}
          .lp-screen>.lp-visual--dashboard img{border:0;border-radius:0;box-shadow:none}
          .lp-screen>.lp-visual--dashboard .lp-visual__caption{padding:0 18px 16px}
          .lp-form-mascot-card{display:grid;grid-template-columns:180px minmax(0,1fr);align-items:center;gap:24px;max-width:620px;margin:0 auto 32px;padding:16px 24px;color:inherit;text-decoration:none;background:linear-gradient(145deg,#f8fbff,#fff);border:1px solid var(--lp-border);border-radius:18px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
          .lp-form-mascot-card:hover{transform:translateY(-2px);border-color:rgba(37,99,235,.38);box-shadow:0 16px 34px rgba(15,23,42,.10)}
          .lp-form-mascot-card:focus-visible{outline:3px solid var(--lp-blue);outline-offset:4px}
          .lp-form-mascot-card img{display:block;width:100%;height:auto;max-height:190px;object-fit:contain}
          .lp-form-mascot-card__copy{font-size:.9rem;line-height:1.8;color:var(--lp-muted)}
          .lp-form-mascot-card__copy strong{display:block;margin-bottom:6px;color:var(--lp-dark);font-size:1.08rem}
          @media(max-width:900px){.lp-founding-badge{right:4px;top:-54px;width:104px}}
          @media(max-width:768px){
            .lp-visual{margin-top:28px}
            .lp-visual img{border-radius:12px}
            .lp-visual--desktop-only{display:none}
            .lp-visual--mobile-only{display:block;max-width:390px}
            .lp-founding-badge{position:static;display:block;width:92px;margin:16px auto 0}
            .lp-form-mascot-card{grid-template-columns:112px minmax(0,1fr);gap:14px;padding:14px}
            .lp-form-mascot-card img{max-height:145px}
          }
          @media(max-width:480px){
            .lp-form-mascot-card{grid-template-columns:1fr;text-align:center}
            .lp-form-mascot-card img{max-height:170px}
            .lp-visual__caption{font-size:.72rem}
          }
          @media(prefers-reduced-motion:reduce){.lp-form-mascot-card{transition:none}}
          EOF
          sed -i 's/^          //' assets/css/hack2-founding-monitor-visuals.css

      - name: Write LP-only placement script
        shell: bash
        run: |
          cat > assets/js/hack2-founding-monitor-visuals.js <<'EOF'
          (function(){
            'use strict';
            var path=window.location.pathname.replace(/\/+$/,'');
            if(path!=='/lp/hack2/founding-monitor')return;
            if(document.documentElement.dataset.hack2Visuals==='ready')return;
            document.documentElement.dataset.hack2Visuals='ready';
            var ROOT='/images/lp/hack2/founding-monitor/';
            var assets={
              hero:['hero.webp','HackⅡ Founding Monitorの90日間計測とサイトURL入力を説明するビジュアル',560,315],
              narrative:['ai-visibility.webp','AI検索上の見えない評価をデータで可視化する説明ビジュアル',480,251],
              competitor:['competitor.webp','自社サイトと競合2社を比較して改善優先度を整理する説明ビジュアル',400,400],
              plan:['plan-90days.webp','90日間・質問10件・競合2社・計測3回・面談2回の進行イメージ',360,480],
              cta:['url-cta.webp','対策したいサイトURLの入力を促す案内ビジュアル',560,175],
              badge:['founding-badge.webp','',200,200],
              mascot:['mascot-cta.webp','サイトURLを入力してFounding Monitorへ申し込む',220,220],
              flow:['application-flow.webp','URL入力から情報入力、送信、商談予約までの流れ',560,210],
              dashboard:['dashboard.webp','HackⅡ Founding Monitorのレポート画面構成イメージ',520,334],
              mobile:['mobile-hero.webp','スマートフォン向けFounding Monitor案内ビジュアル',280,498]
            };
            function image(asset,loading){var img=document.createElement('img');img.src=ROOT+asset[0];img.alt=asset[1];img.width=asset[2];img.height=asset[3];img.loading=loading||'lazy';img.decoding='async';return img}
            function visual(asset,options){options=options||{};var wrap=document.createElement('div');wrap.className='lp-visual '+(options.className||'');var figure=document.createElement('figure');figure.className='lp-visual__frame';figure.appendChild(image(asset,options.loading));wrap.appendChild(figure);if(options.caption){var caption=document.createElement('p');caption.className='lp-visual__caption';caption.textContent=options.caption;wrap.appendChild(caption)}return wrap}
            function insertAfter(reference,node){if(reference&&reference.parentNode)reference.parentNode.insertBefore(node,reference.nextSibling)}
            var heroWrap=document.querySelector('.lp-hero .lp-wrap');var heroBox=document.getElementById('heroUrlBox')||document.querySelector('.lp-hero .lp-url-box');
            if(heroWrap&&heroBox){var desktopHero=visual(assets.hero,{className:'lp-visual--hero lp-visual--desktop-only',loading:'eager'});heroBox.parentNode.insertBefore(desktopHero,heroBox);var mobileHero=visual(assets.mobile,{className:'lp-visual--hero lp-visual--mobile-only',loading:'eager'});heroBox.parentNode.insertBefore(mobileHero,heroBox);var badge=image(assets.badge,'eager');badge.className='lp-founding-badge';badge.setAttribute('aria-hidden','true');heroWrap.appendChild(badge)}
            var problems=document.querySelector('.lp-problems');if(problems)insertAfter(problems,visual(assets.narrative,{caption:'AIが御社をどう理解しているかを、推測ではなく計測結果で確認します。'}));
            var features=document.querySelector('.lp-features');if(features)insertAfter(features,visual(assets.competitor,{className:'lp-visual--square',caption:'比較表は説明用の構成イメージです。実際の計測結果は対象サイトごとに異なります。'}));
            var screenPlaceholder=document.querySelector('.lp-screen-placeholder');if(screenPlaceholder)screenPlaceholder.replaceWith(visual(assets.dashboard,{className:'lp-visual--dashboard',caption:'画面はレポート構成のイメージです。実際の表示内容とは異なる場合があります。'}));
            var spec=document.querySelector('#program .lp-spec')||document.querySelector('.lp-spec');if(spec)spec.parentNode.insertBefore(visual(assets.plan,{className:'lp-visual--portrait',caption:'本サービスは設定・計測・分析をトリリオンバンクが行う運用支援型です。Web改修は含みません。'}),spec);
            var flow=document.querySelector('.lp-flow');if(flow)flow.parentNode.insertBefore(visual(assets.flow,{className:'lp-visual--flow'}),flow);
            var firstCta=document.querySelector('.lp-cta-box');if(firstCta){var ctaLink=document.createElement('a');ctaLink.href='#lp-form-section';ctaLink.className='lp-cta-visual-link';ctaLink.setAttribute('aria-label','対策したいサイトURLの入力フォームへ移動');ctaLink.appendChild(image(assets.cta));insertAfter(firstCta,ctaLink)}
            var formIntro=document.querySelector('#lp-form-section .lp-center');if(formIntro){var card=document.createElement('a');card.href='#lp-form-section';card.className='lp-form-mascot-card';card.setAttribute('aria-label','Founding Monitorの申込フォームへ進む');card.appendChild(image(assets.mascot));var copy=document.createElement('span');copy.className='lp-form-mascot-card__copy';copy.innerHTML='<strong>まずは対象サイトを共有してください</strong>URLと会社情報を送信した後に、商談予約へ進みます。送信前にカレンダーへ移動することはありません。';card.appendChild(copy);insertAfter(formIntro,card)}
          })();
          EOF
          sed -i 's/^          //' assets/js/hack2-founding-monitor-visuals.js
          node --check assets/js/hack2-founding-monitor-visuals.js

      - name: Wire assets into Founding Monitor head
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('_includes/tb-head.html')
          text = path.read_text(encoding='utf-8')
          old_og = '<meta property="og:image" content="{% if page.og_image %}{{ page.og_image }}{% else %}https://trillion-bank.jp/trillionbank/assets/img/ogp.png{% endif %}">'
          new_og = '<meta property="og:image" content="{% if page.url == \'/lp/hack2/founding-monitor/\' %}{{ \'/images/lp/hack2/founding-monitor/hero.webp\' | absolute_url }}{% elsif page.og_image %}{{ page.og_image }}{% else %}https://trillion-bank.jp/trillionbank/assets/img/ogp.png{% endif %}">'
          if old_og in text:
              text = text.replace(old_og, new_og, 1)
          elif new_og not in text:
              raise SystemExit('OG image marker was not found')

          block = '''{% if page.url == '/lp/hack2/founding-monitor/' %}
          <link rel="preload" as="image" href="{{ '/images/lp/hack2/founding-monitor/hero.webp' | relative_url }}">
          <link rel="stylesheet" href="{{ '/assets/css/hack2-founding-monitor-visuals.css?v=20260820' | relative_url }}">
          <script defer src="{{ '/assets/js/hack2-founding-monitor-visuals.js?v=20260820' | relative_url }}"></script>
          {% endif %}'''.replace('          ', '')
          if block not in text:
              pattern = r'(<link rel="stylesheet" href="/trillionbank/assets/css/tb\.css\?v=[^"]+">)'
              text, count = re.subn(pattern, lambda m: m.group(1) + '\n' + block, text, count=1)
              if count != 1:
                  raise SystemExit('Base stylesheet marker was not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            images/lp/hack2/founding-monitor \
            assets/css/hack2-founding-monitor-visuals.css \
            assets/js/hack2-founding-monitor-visuals.js \
            _includes/tb-head.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add generated visuals to HackⅡ Founding Monitor LP'
          git push origin HEAD:main
