name: SEO integrity

on:
  pull_request:
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_data/content_guardrails.yml'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - 'scripts/seo_integrity.py'
      - '.github/workflows/seo-integrity.yml'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_data/content_guardrails.yml'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - 'scripts/seo_integrity.py'
      - '.github/workflows/seo-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify approved Insights indexing and sitemap
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/seo_integrity.py 2>&1 | tee seo-integrity.log

      - name: Upload SEO integrity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-integrity-${{ github.event.pull_request.number || github.run_number }}
          path: seo-integrity.log
          if-no-files-found: ignore
          retention-days: 14
