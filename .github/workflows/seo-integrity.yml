name: SEO integrity

on:
  pull_request:
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_data/content_guardrails.yml'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - 'scripts/seo_integrity.py'
      - '.github/workflows/seo-integrity.yml'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_data/content_guardrails.yml'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - 'scripts/seo_integrity.py'
      - '.github/workflows/seo-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify approved Insights indexing and sitemap
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/seo_integrity.py 2>&1 | tee seo-integrity.log

      - name: Publish SEO integrity result to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tb-seo-integrity -->';
            const outcome = process.env.VERIFY_OUTCOME;
            const log = fs.existsSync('seo-integrity.log')
              ? fs.readFileSync('seo-integrity.log', 'utf8').slice(-12000)
              : 'No SEO integrity log was produced.';
            const heading = outcome === 'success'
              ? 'SEO integrity passed'
              : 'SEO integrity failed';
            const body = `${marker}\n### ${heading}\n\n\`\`\`text\n${log.replace(/```/g, "''' ")}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail when SEO integrity failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
