---
layout: null
title: "SUITS DIAGNOSIS（AIオーダースーツ診断） - Regalis Japan Group"
description: "あなたに最適なスーツプランを診断します。15問の必須診断＋10問のプロフェッショナル診断で、最適なプランをご提案します。提供：オーダースーツ研究所 by Regalis Japan Group"
---
<!DOCTYPE html>
<html lang="ja">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/suit-mbti-app/dist/assets/index.css' | relative_url }}">
    <style>
        /* MBTI Suits App統合用スタイル */
        body.diagnosis-page {
            background-color: #0d0d0d;
            overflow-x: hidden;
        }
        
        /* Reactアプリのコンテナ */
        #regalis-suit-app {
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            isolation: isolate;
            margin-top: 0;
        }
        
        /* サイトのヘッダーをReactアプリページでも表示 */
        #main-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        /* Reactアプリのスタイルを保護 */
        #regalis-suit-app {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        
        #regalis-suit-app * {
            box-sizing: border-box;
        }
        
        /* サイトのスタイルがReactアプリに干渉しないように */
        #regalis-suit-app h1,
        #regalis-suit-app h2,
        #regalis-suit-app h3,
        #regalis-suit-app p,
        #regalis-suit-app a,
        #regalis-suit-app button {
            font-family: inherit;
        }
    </style>
</head>
<body class="diagnosis-page">
    <div id="page-transition" aria-live="polite">
        <div class="transition-panel" aria-hidden="true">
            <span class="transition-panel__glass" aria-hidden="true"></span>
            <span class="transition-panel__glare" aria-hidden="true"></span>
        </div>
    </div>
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- Header / Navigation -->
    {% include header.html %}

    <!-- Main Content -->
    <!-- アプリを埋め込むコンテナ -->
    <div id="regalis-suit-app"></div>

    <!-- Footer -->
    {% include footer.html %}
    
    <!-- Reactアプリケーションのスクリプト（先に読み込む） -->
    <script type="module" src="{{ '/suit-mbti-app/dist/assets/index.js' | relative_url }}"></script>
    <!-- サイトのJavaScript（後で読み込む） -->
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    
    <!-- Reactアプリのマウント確認用スクリプト -->
    <script>
        // Reactアプリが正しくマウントされたか確認
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const appElement = document.getElementById('regalis-suit-app');
                if (appElement && appElement.children.length === 0) {
                    console.warn('React app may not have mounted. Check console for errors.');
                } else {
                    console.log('React app mounted successfully.');
                }
            }, 1000);
        });
    </script>
</body>
</html>
