---
layout: null
title: "RAT診断（Regalis Arche Type） - オーダースーツ診断 - Regalis Japan Group"
description: "あなただけのオーダースーツスタイルを発見する、次世代型診断システム。15問の必須診断＋10問のプロフェッショナル診断で、最適なプランをご提案します。提供：オーダースーツ研究所 by Regalis Japan Group"
---
<!DOCTYPE html>
<html lang="ja">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/suit-mbti-app/dist/assets/index.css' | relative_url }}">
    <style>
        /* MBTI Suits App統合用スタイル */
        body.diagnosis-page {
            background-color: #0d0d0d;
            overflow-x: hidden;
        }
        
        /* Reactアプリのコンテナ */
        #regalis-suit-app {
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            isolation: isolate;
            margin-top: 0;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        /* サイトのヘッダーをReactアプリページでも表示 */
        #main-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        /* Reactアプリのスタイルを保護 */
        #regalis-suit-app {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        
        #regalis-suit-app * {
            box-sizing: border-box;
        }
        
        /* サイトのスタイルがReactアプリに干渉しないように */
        #regalis-suit-app h1,
        #regalis-suit-app h2,
        #regalis-suit-app h3,
        #regalis-suit-app p,
        #regalis-suit-app a,
        #regalis-suit-app button {
            font-family: inherit;
        }
        
        /* ローディング状態の表示 */
        #regalis-suit-app:empty::before {
            content: 'Loading React app...';
            display: block;
            padding: 2rem;
            text-align: center;
            color: var(--text-muted, #D0D0D0);
            font-size: 1rem;
        }
    </style>
</head>
<body class="diagnosis-page">
    <div id="page-transition" aria-live="polite">
        <div class="transition-panel" aria-hidden="true">
            <span class="transition-panel__glass" aria-hidden="true"></span>
            <span class="transition-panel__glare" aria-hidden="true"></span>
        </div>
    </div>
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- Header / Navigation -->
    {% include header.html %}

    <!-- Main Content -->
    <!-- アプリを埋め込むコンテナ -->
    <div id="regalis-suit-app"></div>

    <!-- Footer -->
    {% include footer.html %}
    
    <!-- Reactアプリケーションのスクリプト（先に読み込む） -->
    <script type="module" src="{{ '/suit-mbti-app/dist/assets/index.js' | relative_url }}" onerror="console.error('Failed to load React app script:', this.src)"></script>
    <!-- サイトのJavaScript（後で読み込む） -->
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    
    <!-- Reactアプリのマウント確認用スクリプト -->
    <script>
        // Reactアプリが正しくマウントされたか確認
        window.addEventListener('DOMContentLoaded', function() {
            console.log('DOMContentLoaded - Checking React app mount...');
            const appElement = document.getElementById('regalis-suit-app');
            if (!appElement) {
                console.error('ERROR: #regalis-suit-app element not found!');
                return;
            }
            console.log('Found #regalis-suit-app element');
            
            // スクリプトの読み込み確認
            const script = document.querySelector('script[src*="index.js"]');
            if (script) {
                console.log('React script tag found:', script.src);
            } else {
                console.error('ERROR: React script tag not found!');
            }
            
            // CSSの読み込み確認
            const link = document.querySelector('link[href*="index.css"]');
            if (link) {
                console.log('React CSS link found:', link.href);
            } else {
                console.error('ERROR: React CSS link not found!');
            }
            
            // マウント確認（複数回チェック）
            let checkCount = 0;
            const checkMount = setInterval(function() {
                checkCount++;
                if (appElement.children.length > 0) {
                    console.log('✓ React app mounted successfully after', checkCount * 500, 'ms');
                    clearInterval(checkMount);
                } else if (checkCount > 10) {
                    console.error('ERROR: React app did not mount after 5 seconds. Check browser console for errors.');
                    clearInterval(checkMount);
                }
            }, 500);
        });
        
        // グローバルエラーハンドラー
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.includes('index.js')) {
                console.error('ERROR loading React app:', e.message, e.filename, e.lineno);
            }
        });
        
        // モジュール読み込みエラー
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection (possibly from React app):', e.reason);
        });
    </script>
</body>
</html>
