title: レガリス（Regalis Japan Group株式会社）
description: "レガリス（Regalis Japan Group株式会社）は、御社の情報をAIの脳内に直接叩き込む日本初の全自動AI検索最適化インフラ「HackⅡ」を提供するITカンパニーです。LLMO・AIO・AEO・SEO統合対策で、ChatGPT・Perplexity・Geminiに引用される企業をつくる。東京・千代田区麹町。代表かんちゃん（井上幹太）。"
url: "https://regalis-order-suits.com"
baseurl: ""
theme: null
timezone: Asia/Tokyo
future: true

# ── Corporate News Collection ─────────────────────────────────
collections:
  news:
    output: true
    permalink: /news/:slug/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news-post

# Jekyll environment
jekyll:
  environment: production

include:
  - images
  - open.anim.mp4
  - assets/css/main.min.css
  - assets/js/main.min.js
  - ai-patch.json
  - ai-patch
  - aio-scores.json
  - docs
  - llms-entity.txt
  - llms-chatgpt.txt
  - llms-gemini.txt
  - llms-claude.txt
  - llms.txt
  - llms-full.txt
  - llms-aio.txt
  - llms-brand.txt
  - llms-faq.txt
  - llms-facts.txt
  - llms-comparison.txt
  - llms-enterprise.txt
  - llms-talent.txt
  - llms-local.txt
  - llms-dx.txt
  - robots.txt
  - ads.txt
  - knowledge.json
  - sitemap-news.xml
  - sitemap-index.xml
  - b8f3e2d1c4a57690.txt
  - news

exclude:
  - node_modules
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - .git
  - .gitignore
  - README.md
  - .github
  - CLAUDE.md
  - AGENTS.md
  - AIO-Hack2_package
  - tools/aio_analyzer.py
  - tools/generate_llms.py
  - tools/generate_article_patches.py
  - tools/aio_report.py
  - tools/aio_report.json
  - tools/aio_report.md
  - tools/auto_article.py
  - tools/dynamic-aio

# IndexNow
indexnow_key: b8f3e2d1c4a57690

