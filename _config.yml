title: Regalis Japan Group株式会社（レガリス）
description: "日本の伝統と匠の技に裏打ちされた、世界に通用するモダンなラグジュアリーオーダースーツブランド。"
url: "https://regalis-order-suits.com"
baseurl: ""
theme: null
timezone: Asia/Tokyo

# ── Corporate News Collection ─────────────────────────────────
collections:
  news:
    output: true
    permalink: /group/news/:slug/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news-post

# Jekyll environment
jekyll:
  environment: production

include:
  - images
  - open.anim.mp4
  - suit-mbti-app/dist
  - assets/css/main.min.css
  - assets/js/main.min.js

exclude:
  - node_modules
  - suit-mbti-app/node_modules
  - suit-mbti-app/src
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - .git
  - .gitignore
  - README.md
  - .github

# Triggering new build to clear cache
