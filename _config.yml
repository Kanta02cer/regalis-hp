title: 株式会社Trillion Bank | AI検索時代の情報流通を、測定と運用へ
description: "株式会社Trillion Bank（トリリオンバンク）は、AI回答における企業・ブランドの候補入り、競合、引用元を測定するHackⅡと、AIコンテンツ利用の契約・証跡を扱うAdctorの研究開発に取り組むテクノロジー企業です。"
url: "https://trillion-bank.jp"
baseurl: ""
theme: null
timezone: Asia/Tokyo
future: false

collections:
  news:
    output: true
    permalink: /news/:slug/
  tbnews:
    output: true
    permalink: /trillionbank/news/:slug/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news-post
      robots: noindex, follow
  - scope:
      path: ""
      type: "tbnews"
    values:
      layout: tb-article
      robots: index, follow

