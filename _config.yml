title: 株式会社トリリオンバンク | AI検索時代の情報流通を、測る・守る・正規化する
description: "株式会社トリリオンバンク（Trillion Bank）は、AI検索時代の情報流通を「測る・守る・正規化する」テクノロジーカンパニーです。AI検索計測インフラ「HackⅡ」、AIクローリング最適化「Adctor / Pay per Crawl」を開発。東京都千代田区。代表：井上幹太。"
url: "https://trillion-bank.jp"
baseurl: ""
theme: null
timezone: Asia/Tokyo
future: true

# ── Corporate News Collection ─────────────────────────────────
collections:
  news:
    output: true
    permalink: /news/:slug/
  tbnews:
    output: true
    permalink: /trillionbank/news/:slug/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news-post
  - scope:
      path: ""
      type: "tbnews"
    values:
      layout: tb-article

# Jekyll environment
jekyll:
  environment: production

