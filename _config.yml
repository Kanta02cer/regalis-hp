title: Regalis Japan Group株式会社
description: "設計から始めるDXカンパニー。AI・DXコンサルティング・Web・システム開発・SEO/AIOメディア運営を軸に、日本の中小企業のデジタル変革を支援。東京・千代田区麹町。"
url: "https://regalis-order-suits.com"
baseurl: ""
theme: null
timezone: Asia/Tokyo

# ── Corporate News Collection ─────────────────────────────────
collections:
  news:
    output: true
    permalink: /news/:slug/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news-post

# Jekyll environment
jekyll:
  environment: production

include:
  - images
  - open.anim.mp4
  - suit-mbti-app/dist
  - assets/css/main.min.css
  - assets/js/main.min.js
  - llms.txt
  - llms-full.txt
  - robots.txt

exclude:
  - node_modules
  - suit-mbti-app/node_modules
  - suit-mbti-app/src
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - .git
  - .gitignore
  - README.md
  - .github
  - CLAUDE.md
  - tools/aio_analyzer.py
  - tools/generate_llms.py
  - tools/aio_report.json
  - tools/dynamic-aio

# Triggering new build to clear cache
