title: 株式会社Trillion Bank | AI検索の見え方と情報利用を、測定・証跡・運用へ
description: "株式会社Trillion Bankは、AI回答で企業・ブランドがどのように説明・比較・引用されるかを測定するHackⅡと、AIによるコンテンツ利用の契約・利用証跡を研究するAdctorに取り組むテクノロジー企業です。"
url: "https://trillion-bank.jp"
baseurl: ""
theme: null
timezone: Asia/Tokyo
future: false

collections:
  news:
    output: true
    permalink: /news/:slug/
  tbnews:
    output: true
    permalink: /trillionbank/news/:slug/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news-post
      robots: noindex, follow
  - scope:
      path: ""
      type: "tbnews"
    values:
      layout: tb-article
      author: "井上 幹太"
      reviewed_by: "株式会社Trillion Bank 編集部"
      robots: noindex, follow
  # Insights一覧で公開承認した記事のみ、個別にindexを許可する。
  # 新規記事は、編集確認後にここへ追加し、SEO integrity CIを通す。
  - scope:
      path: "_tbnews/2026-09-05-seo-aeo-geo-aio-llmo-difference.md"
      type: "tbnews"
    values:
      robots: "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
  - scope:
      path: "_tbnews/2026-09-05-ai-search-measurement-method.md"
      type: "tbnews"
    values:
      robots: "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
  - scope:
      path: "_tbnews/2026-09-05-pay-per-crawl-pay-per-use-difference.md"
      type: "tbnews"
    values:
      robots: "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"

