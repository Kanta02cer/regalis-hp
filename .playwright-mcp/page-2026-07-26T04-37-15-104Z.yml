    - heading "Pay per Crawl技術ホワイトペーパー｜AIクローラ課金の仕組みと実装アプローチ" [level=1] [ref=f2e30]
  - article [ref=f2e33]:
    - generic [ref=f2e34]:
      - generic [ref=f2e35]: 執筆：井上 幹太（代表取締役CEO）
      - generic [ref=f2e36]: 公開：2026年07月27日
    - paragraph [ref=f2e37]:
      - strong [ref=f2e38]: Pay per Crawl（ペイ・パー・クロール）とは、AIクローラのWebアクセスに対してサイト運営者が対価を設定・徴収するための技術的フレームワークです。
      - text: 本記事では、その仕組みと実装アプローチを技術的な観点から解説します。
    - blockquote [ref=f2e39]:
      - paragraph [ref=f2e40]: ※ 本記事は技術解説を目的としたホワイトペーパーです。株式会社トリリオンバンクではPay per Crawlの研究開発・PoC（概念実証）の相談を受け付けています。実運用には業界標準の確立が必要であり、本記事の内容をもって特定の成果を保証するものではありません。
    - separator [ref=f2e41]
    - heading "技術アーキテクチャの全体像" [level=2] [ref=f2e42]
    - paragraph [ref=f2e43]: Pay per Crawlは、以下の3レイヤーで構成されます。
    - code [ref=f2e47]: "[Layer 1: 識別] AIクローラの検知・分類 ↓ [Layer 2: 制御] 課金ウォールによるアクセス制御 ↓ [Layer 3: 収益化] クロール単位の課金・ロギング"
    - paragraph [ref=f2e48]: 各レイヤーの役割と技術的な詳細を順に解説します。
    - separator [ref=f2e49]
    - 'heading "Layer 1: AIクローラの識別" [level=2] [ref=f2e50]'
    - heading "識別の3層アプローチ" [level=3] [ref=f2e51]
    - paragraph [ref=f2e52]:
      - text: AIクローラの識別は、単一の手法では偽装に脆弱です。以下の3層を組み合わせた
      - strong [ref=f2e53]: 複合スコアリング
      - text: が必要です。
    - heading "1-1. User-Agent文字列の照合" [level=4] [ref=f2e54]
    - paragraph [ref=f2e55]: 主要なAIクローラは、公式のUser-Agent文字列を名乗ります。
    - table [ref=f2e56]:
      - rowgroup [ref=f2e57]:
        - row [ref=f2e58]:
          - columnheader "クローラ" [ref=f2e59]
          - columnheader "User-Agent" [ref=f2e60]
          - columnheader "運営" [ref=f2e61]
      - rowgroup [ref=f2e62]:
        - row [ref=f2e63]:
          - cell "GPTBot" [ref=f2e64]
          - cell [ref=f2e65]:
            - code [ref=f2e66]: GPTBot/1.0
          - cell "OpenAI" [ref=f2e67]
        - row [ref=f2e68]:
          - cell "ChatGPT-User" [ref=f2e69]
          - cell [ref=f2e70]:
            - code [ref=f2e71]: ChatGPT-User
          - cell "OpenAI（ブラウジング）" [ref=f2e72]
        - row [ref=f2e73]:
          - cell "ClaudeBot" [ref=f2e74]
          - cell [ref=f2e75]:
            - code [ref=f2e76]: ClaudeBot
          - cell "Anthropic" [ref=f2e77]
        - row [ref=f2e78]:
          - cell "Google-Extended" [ref=f2e79]
          - cell [ref=f2e80]:
            - code [ref=f2e81]: Google-Extended
          - cell "Google" [ref=f2e82]
        - row [ref=f2e83]:
          - cell "PerplexityBot" [ref=f2e84]
          - cell [ref=f2e85]:
            - code [ref=f2e86]: PerplexityBot
          - cell "Perplexity" [ref=f2e87]
        - row [ref=f2e88]:
          - cell "Bytespider" [ref=f2e89]
          - cell [ref=f2e90]:
            - code [ref=f2e91]: Bytespider
          - cell "ByteDance" [ref=f2e92]
    - paragraph [ref=f2e93]:
      - text: User-Agent照合は最も基本的な識別手段ですが、
      - strong [ref=f2e94]: 偽装が容易
      - text: であるため、これだけに依存するのは危険です。
    - heading "1-2. IPレンジの照合" [level=4] [ref=f2e95]
    - paragraph [ref=f2e96]: OpenAI・Anthropic等の主要AI企業は、クローラが使用するIPレンジを公開しています。
    - list [ref=f2e97]:
      - listitem [ref=f2e98]:
        - strong [ref=f2e99]: "OpenAI:"
        - code [ref=f2e100]: openai.com
        - text: に公開されたIPv4/IPv6レンジ
      - listitem [ref=f2e101]:
        - strong [ref=f2e102]: "Anthropic:"
        - text: 公式ドキュメントに記載のIPレンジ
      - listitem [ref=f2e103]:
        - strong [ref=f2e104]: "Google:"
        - code [ref=f2e105]: Google-Extended
        - text: 用の公開IPレンジ
    - paragraph [ref=f2e106]: User-Agentが「GPTBot」を名乗っていても、IPレンジがOpenAIの公開範囲外であれば偽装の可能性が高いと判定します。
    - code [ref=f2e110]: "判定ロジック（擬似コード）: if user_agent matches \"GPTBot\" AND ip in OPENAI_IP_RANGES: → 信頼度: HIGH（正規GPTBot） if user_agent matches \"GPTBot\" AND ip NOT in OPENAI_IP_RANGES: → 信頼度: LOW（偽装の疑い）"
    - heading "1-3. リクエストパターン分析" [level=4] [ref=f2e111]
    - paragraph [ref=f2e112]: User-AgentとIPの照合を通過した場合でも、リクエストの振る舞いを分析することで、正規のAIクローラか否かをさらに精査できます。
    - paragraph [ref=f2e113]: "分析対象のパターン:"
    - list [ref=f2e114]:
      - listitem [ref=f2e115]:
        - strong [ref=f2e116]: "robots.txtの事前確認:"
        - text: 正規のクローラは通常、最初にrobots.txtを取得します。これを行わないクローラは疑わしいと判定できます。
      - listitem [ref=f2e117]:
        - strong [ref=f2e118]: "アクセス頻度・間隔:"
        - text: 正規クローラは一定の間隔でアクセスする傾向があり、人間のようなランダム間隔や、DDoS的な高頻度アクセスとは区別できます。
      - listitem [ref=f2e119]:
        - strong [ref=f2e120]: "巡回パターン:"
        - text: サイトマップに沿った体系的なクロールか、特定ページへの狙い撃ちかで分類します。
    - separator [ref=f2e121]
    - 'heading "Layer 2: 課金ウォールのアーキテクチャ" [level=2] [ref=f2e122]'
    - heading "Edge Computingベースの実装" [level=3] [ref=f2e123]
    - paragraph [ref=f2e124]: 課金ウォールは、オリジンサーバーの手前（Edge）で動作させるのが最適です。理由は3つあります。
    - list [ref=f2e125]:
      - listitem [ref=f2e126]:
        - strong [ref=f2e127]: "レイテンシ:"
        - text: Edgeで処理することで、オリジンへのリクエスト到達前にアクセス制御を完了できます。
      - listitem [ref=f2e128]:
        - strong [ref=f2e129]: "スケーラビリティ:"
        - text: AIクローラのアクセスは予測困難なスパイクを伴うため、CDNのEdge基盤は高負荷に強い設計が求められます。
      - listitem [ref=f2e130]:
        - strong [ref=f2e131]: "オリジン保護:"
        - text: 未認証のクローラがオリジンに到達するのを防ぎます。
    - heading "認証トークン方式" [level=3] [ref=f2e132]
    - paragraph [ref=f2e133]:
      - text: 課金ウォールの中核は、
      - strong [ref=f2e134]: トークンベースのアクセス制御
      - text: です。
    - code [ref=f2e138]: "処理フロー: 1. AIクローラがリクエストを送信 2. Edge Workerが Layer 1 でクローラを識別 3. 有効なAPIトークンの有無を確認 → トークンあり: コンテンツを配信、クロール課金を記録 → トークンなし: 認証要求レスポンス（402 Payment Required）を返却 4. 課金対象のクロールをログに記録"
    - paragraph [ref=f2e139]: HTTP 402 (Payment Required) は、HTTPの仕様上「将来の使用のために予約」されたステータスコードですが、Pay per Crawlの文脈では「対価を支払えばアクセス可能」を表現するのに適しています。
    - heading "コンテンツの段階的開示" [level=3] [ref=f2e140]
    - paragraph [ref=f2e141]: すべてのコンテンツを一律にブロックするのではなく、段階的な開示モデルも検討されています。
    - table [ref=f2e142]:
      - rowgroup [ref=f2e143]:
        - row [ref=f2e144]:
          - columnheader "アクセスレベル" [ref=f2e145]
          - columnheader "提供内容" [ref=f2e146]
          - columnheader "課金" [ref=f2e147]
      - rowgroup [ref=f2e148]:
        - row [ref=f2e149]:
          - cell "Free Tier" [ref=f2e150]
          - cell "タイトル・メタ情報・概要（200文字）" [ref=f2e151]
          - cell "無料" [ref=f2e152]
        - row [ref=f2e153]:
          - cell "Standard" [ref=f2e154]
          - cell "本文テキスト（全文）" [ref=f2e155]
          - cell "¥0.1〜¥1 / クロール" [ref=f2e156]
        - row [ref=f2e157]:
          - cell "Premium" [ref=f2e158]
          - cell "構造化データ・API・リアルタイムデータ" [ref=f2e159]
          - cell "¥1〜¥10 / クロール" [ref=f2e160]
    - paragraph [ref=f2e161]: この段階的開示により、「完全ブロック」と「完全無償提供」の間にグラデーションを持たせることができます。
    - separator [ref=f2e162]
    - 'heading "Layer 3: Cloudflare Workers / Edge での実装アプローチ" [level=2] [ref=f2e163]'
    - heading "なぜCloudflare Workersか" [level=3] [ref=f2e164]
    - paragraph [ref=f2e165]: Cloudflare Workersは、Pay per Crawlの課金ウォール実装に適した特性を持っています。
    - list [ref=f2e166]:
      - listitem [ref=f2e167]:
        - strong [ref=f2e168]: "グローバルEdge:"
        - text: 300以上のPoP（Point of Presence）で低レイテンシ処理
      - listitem [ref=f2e169]:
        - strong [ref=f2e170]: "Workers KV / Durable Objects:"
        - text: クロール回数・トークン残高の分散ストレージ
      - listitem [ref=f2e171]:
        - strong [ref=f2e172]: "AI Bot管理機能（既存）:"
        - text: Cloudflareが提供するAI Audit機能との連携が可能
      - listitem [ref=f2e173]:
        - strong [ref=f2e174]: "コスト:"
        - text: 10万リクエスト/日まで無料プラン、有料は$5/月〜
    - heading "実装の概念設計" [level=3] [ref=f2e175]
    - code [ref=f2e179]: Cloudflare Worker（Edge） ├── 1. リクエスト受信 ├── 2. User-Agent + IP照合（KVから既知Bot DB参照） ├── 3. トークン検証（Authorizationヘッダ or クエリパラメータ） ├── 4. 課金判定 │ ├── 有効トークン → オリジンにプロキシ → レスポンス返却 │ └── 無効/なし → 402 Payment Required + 認証案内 └── 5. クロールログ記録（Durable Objects or Analytics Engine）
    - heading "他のEdge基盤" [level=3] [ref=f2e180]
    - paragraph [ref=f2e181]: Cloudflare Workers以外にも、以下の基盤で同様の実装が検討可能です。
    - list [ref=f2e182]:
      - listitem [ref=f2e183]:
        - strong [ref=f2e184]: "Fastly Compute:"
        - text: Wasmベースのサーバーレス実行環境
      - listitem [ref=f2e185]:
        - strong [ref=f2e186]: "AWS CloudFront Functions / Lambda@Edge:"
        - text: AWSエコシステムとの統合
      - listitem [ref=f2e187]:
        - strong [ref=f2e188]: "Vercel Edge Functions:"
        - text: Next.jsアプリケーションとの統合
    - paragraph [ref=f2e189]: いずれの場合も、Edgeでリクエストを捕捉→識別→制御→ログ記録、という基本フローは共通です。
    - separator [ref=f2e190]
    - heading "法的フレームワークとの関係" [level=2] [ref=f2e191]
    - heading "著作権法30条の4（日本）" [level=3] [ref=f2e192]
    - paragraph [ref=f2e193]: 日本の著作権法30条の4は、「著作権者の利益を不当に害しない限り」、情報解析（AI学習含む）目的での著作物利用を許容しています。
    - paragraph [ref=f2e194]:
      - text: Pay per Crawlは著作物の利用を
      - strong [ref=f2e195]: 禁止するのではなく、対価を設定して許諾する仕組み
      - text: です。著作権法の枠組みと直接矛盾するものではありませんが、以下の論点が残ります。
    - list [ref=f2e196]:
      - listitem [ref=f2e197]:
        - strong [ref=f2e198]: "「不当に害する」の線引き:"
        - text: 大規模な商用AI学習が著作権者の利益を「不当に害する」かどうかは、判例の蓄積を待つ段階です。
      - listitem [ref=f2e199]:
        - strong [ref=f2e200]: "対価還元の法的根拠:"
        - text: 現行法はAI学習を「許可/禁止」の二項で扱っており、「対価を条件とした許諾」を直接規定していません。契約ベースでの対応が現実的です。
    - heading "EU AI Act のデータ透明性要件" [level=3] [ref=f2e201]
    - paragraph [ref=f2e202]: 2024年に成立したEU AI Act（人工知能規制法）は、AIシステムに対して以下を求めています。
    - list [ref=f2e203]:
      - listitem [ref=f2e204]:
        - strong [ref=f2e205]: "学習データの出所開示義務:"
        - text: 汎用AIモデル（GPAI）の提供者は、学習に使用した著作物の要約を公開する義務を負います。
      - listitem [ref=f2e206]:
        - strong [ref=f2e207]: "著作権法との整合:"
        - text: EUの著作権指令（2019/790）のテキスト・データマイニング（TDM）規定と連携し、権利者がオプトアウトできる仕組みを前提としています。
    - paragraph [ref=f2e208]: Pay per Crawlは、このEU AI Actの透明性要件に対して「対価を得て許諾する」という第三の選択肢を提供するモデルとして位置づけられます。
    - heading "TDMRepプロトコル" [level=3] [ref=f2e209]
    - paragraph [ref=f2e210]: W3Cコミュニティグループが策定中のTDMRep（Text and Data Mining Reservation Protocol）は、テキスト・データマイニングに対する権利者の意思表示を機械可読にするプロトコルです。
    - paragraph [ref=f2e211]: 現状のTDMRepは「許可/拒否」の表現にとどまりますが、将来的に課金条件の記述が追加されれば、Pay per Crawlの標準化に大きく貢献する可能性があります。
    - separator [ref=f2e212]
    - heading "実用化に向けた課題" [level=2] [ref=f2e213]
    - heading "技術的課題" [level=3] [ref=f2e214]
    - list [ref=f2e215]:
      - listitem [ref=f2e216]:
        - strong [ref=f2e217]: "Bot識別の精度維持:"
        - text: 新規クローラの出現やUser-Agent偽装への継続的対応が必要です。
      - listitem [ref=f2e218]:
        - strong [ref=f2e219]: "レイテンシの最小化:"
        - text: Edge処理でもKV参照やトークン検証にはms単位のオーバーヘッドが発生します。
      - listitem [ref=f2e220]:
        - strong [ref=f2e221]: "ログの整合性:"
        - text: 分散Edge環境でのクロール回数の正確な集計には、Durable Objectsなどの強整合性ストレージが求められます。
    - heading "制度的課題" [level=3] [ref=f2e222]
    - list [ref=f2e223]:
      - listitem [ref=f2e224]:
        - strong [ref=f2e225]: "課金プロトコルの標準化:"
        - text: 「1クロールあたりの単価」を機械可読で公開・交渉する業界標準が存在しません。
      - listitem [ref=f2e226]:
        - strong [ref=f2e227]: "AI企業側のインセンティブ:"
        - text: 現状、AI企業がクロール課金を受け入れる商慣行は確立されていません。
      - listitem [ref=f2e228]:
        - strong [ref=f2e229]: "法的枠組みの整備:"
        - text: 「対価を条件とした利用許諾」を著作権法の中で明確に位置づけるには、立法または判例の蓄積が必要です。
    - separator [ref=f2e230]
    - heading "よくある質問（FAQ）" [level=2] [ref=f2e231]
    - paragraph [ref=f2e232]:
      - strong [ref=f2e233]: Q. Pay per Crawlの技術的な仕組みはどうなっていますか？
      - text: A. AIクローラの識別（3層判定）、Edge Computingベースの課金ウォール（トークン認証方式）、クロール単位の課金・ロギングの3レイヤーで構成されます。
    - paragraph [ref=f2e234]:
      - strong [ref=f2e235]: Q. AIクローラはどうやって識別するのですか？
      - text: A. User-Agent文字列の照合、公開IPレンジとの突合、リクエストパターン分析の3層を組み合わせた複合スコアリングで識別します。
    - paragraph [ref=f2e236]:
      - strong [ref=f2e237]: Q. 著作権法との関係はどうなっていますか？
      - text: A. 日本の著作権法30条の4は非享受目的の利用を条件付きで許容しており、Pay per Crawlは利用を禁止するのではなく対価を設定して許諾する仕組みです。ただし法的な確定はしておらず、判例の蓄積を待つ段階です。
    - paragraph [ref=f2e238]:
      - strong [ref=f2e239]: Q. 今すぐ実装できますか？
      - text: A. 技術的な要素は個別には実装可能ですが、業界標準の課金プロトコルが未確立であるため、PoC（概念実証）が必要です。株式会社トリリオンバンクでは研究開発・PoC相談を受け付けています。
    - separator [ref=f2e240]
    - heading "まとめ" [level=2] [ref=f2e241]
    - paragraph [ref=f2e242]: Pay per Crawlは、AIクローラの識別・制御・課金を3レイヤーで実装する技術フレームワークです。Cloudflare WorkersをはじめとするEdge Computing基盤を活用することで、低レイテンシかつスケーラブルな課金ウォールの構築が技術的に可能になりつつあります。
    - paragraph [ref=f2e243]: 一方で、Bot識別の精度維持、課金プロトコルの標準化、法的枠組みの整備など、業界全体で取り組むべき課題が残っています。
    - paragraph [ref=f2e244]:
      - text: 株式会社トリリオンバンクは、この領域の
