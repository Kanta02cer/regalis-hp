      - text: ／ コラム
    - text: 2026.07.18 コラム
    - heading "【2026年最新】LLMOとは？AI検索最適化の基礎・SEOとの違い・始め方" [level=1] [ref=f11e25]
  - article [ref=f11e28]:
    - generic [ref=f11e29]:
      - generic [ref=f11e30]: 執筆：井上 幹太（代表取締役CEO）
      - generic [ref=f11e31]: 公開：2026年07月18日
    - paragraph [ref=f11e32]:
      - strong [ref=f11e33]: LLMO（Large Language Model Optimization）とは、ChatGPTやPerplexityなどの大規模言語モデル（LLM）に、自社の情報を正しく・優先的に引用・推薦してもらうための最適化手法です。
      - text: 「AIO（AI Optimization）」「GEO（Generative Engine Optimization）」など呼び方はいくつかありますが、いずれもAI検索時代の最適化を指す近い概念です。
    - heading "なぜ今LLMOが重要なのか" [level=2] [ref=f11e34]
    - paragraph [ref=f11e35]: 検索のあり方が変化しています。Gartnerは2024年2月のレポートで「2026年までに従来の検索エンジンのトラフィックが25%減少する」との予測を発表しています。また、SparkToroとDatosの2024年の調査によれば、Google検索の約60%がクリックなし（ゼロクリック）で完結しているとされています。
    - paragraph [ref=f11e36]: こうした背景のなかで、ユーザーが「検索する」代わりに「AIに聞く」場面が増えつつあることが、Reuters Institute Digital News Report（2024年）などでも報告されています。
    - paragraph [ref=f11e37]: この流れにおいて、AI検索への最適化が未着手の企業は少なくありません。「自社が出てこない」「競合ばかり推薦される」「古い情報が引用される」——こうした機会損失が、営業に問い合わせが来る前の段階で起きている可能性があります。
    - heading "LLMOとSEOの違い" [level=2] [ref=f11e38]
    - paragraph [ref=f11e39]: LLMOとSEOは対立する概念ではなく、目的と対象が異なります。
    - table [ref=f11e40]:
      - rowgroup [ref=f11e41]:
        - row [ref=f11e42]:
          - columnheader "比較項目" [ref=f11e43]
          - columnheader "SEO" [ref=f11e44]
          - columnheader "LLMO" [ref=f11e45]
      - rowgroup [ref=f11e46]:
        - row [ref=f11e47]:
          - cell [ref=f11e48]:
            - strong [ref=f11e49]: 対象
          - cell "検索エンジン（Google等）" [ref=f11e50]
          - cell "生成AI・AI検索（ChatGPT, Perplexity等）" [ref=f11e51]
        - row [ref=f11e52]:
          - cell [ref=f11e53]:
            - strong [ref=f11e54]: ゴール
          - cell "検索順位の向上・クリック流入" [ref=f11e55]
          - cell "AI回答内での引用・推薦" [ref=f11e56]
        - row [ref=f11e57]:
          - cell [ref=f11e58]:
            - strong [ref=f11e59]: 主な指標
          - cell "順位・CTR・オーガニック流入数" [ref=f11e60]
          - cell "引用率・出現率・推薦順位" [ref=f11e61]
        - row [ref=f11e62]:
          - cell [ref=f11e63]:
            - strong [ref=f11e64]: 重要な要素
          - cell "キーワード・被リンク・ページ速度" [ref=f11e65]
          - cell "構造化データ・一次情報・エンティティの明確さ" [ref=f11e66]
        - row [ref=f11e67]:
          - cell [ref=f11e68]:
            - strong [ref=f11e69]: 成果の表れ方
          - cell "検索結果ページに表示される" [ref=f11e70]
          - cell "AIの回答テキスト内で言及・引用される" [ref=f11e71]
    - paragraph [ref=f11e72]: SEOが不要になるわけではありません。検索エンジン経由の流入は依然として大きく、SEOとLLMOを併存させるのが現実的なアプローチです。
    - heading "LLMOで重要なシグナル" [level=2] [ref=f11e73]
    - paragraph [ref=f11e74]: LLMが情報を引用・推薦する際に重視するとされているシグナルには、以下のようなものがあります。
    - heading "1. 構造化された一次情報" [level=3] [ref=f11e75]
    - paragraph [ref=f11e76]: 定義文（「〇〇とは」）、具体的な数字、手順、料金など、AIが引用しやすい「事実の塊」がページ内に存在することが重要です。曖昧な説明文よりも、具体的で引用しやすい情報が優先される傾向があるとされています。
    - heading "2. エンティティの明確さ" [level=3] [ref=f11e77]
    - paragraph [ref=f11e78]: 企業名・サービス名・代表者名と、それぞれの提供価値が明確に結びついていることが求められます。LLMはエンティティ（固有名詞とその属性）の認識に基づいて回答を構成するため、「何者で、何を提供しているか」が曖昧なサイトは引用されにくい傾向があります。
    - heading "3. 機械可読なデータ提供" [level=3] [ref=f11e79]
    - paragraph [ref=f11e80]:
      - code [ref=f11e81]: llms.txt
      - text: （AIクローラー向けのサイト説明ファイル）や
      - code [ref=f11e82]: JSON-LD
      - text: （構造化データ）など、AIが読み取りやすい形式で情報を提供することが有効とされています。
    - heading "4. 情報の鮮度と一貫性" [level=3] [ref=f11e83]
    - paragraph [ref=f11e84]: 古い情報や矛盾した情報が残っていると、AIの回答精度に悪影響を与える可能性があります。定期的な更新と情報の一貫性維持が推奨されます。
    - heading "5. 信頼性シグナル（E-E-A-T）" [level=3] [ref=f11e85]
    - paragraph [ref=f11e86]: 経験・専門性・権威性・信頼性（E-E-A-T）に相当する要素は、LLMの情報選択にも影響を与えるとされています。第三者からの引用・受賞歴・実績の明示などが、推薦されやすさに寄与する可能性があります。
    - heading "LLMOの始め方" [level=2] [ref=f11e87]
    - list [ref=f11e88]:
      - listitem [ref=f11e89]:
        - strong [ref=f11e90]: 現状把握（測る）
        - text: — AI検索で自社と競合がどう引用されているかを測定する。どの質問で引用され、どの質問で競合に負けているかを可視化する。
      - listitem [ref=f11e91]:
        - strong [ref=f11e92]: 優先度づけ（整理する）
        - text: — 負けている質問カテゴリ、修正すべきページの優先順位を整理する。
      - listitem [ref=f11e93]:
        - strong [ref=f11e94]: 構造化（直す）
        - text: — 定義文・FAQ・比較表を追加し、構造化データ（
        - code [ref=f11e95]: llms.txt
        - text: 、
        - code [ref=f11e96]: JSON-LD
        - text: 等）を整備する。
      - listitem [ref=f11e97]:
        - strong [ref=f11e98]: 継続的な更新（回す）
        - text: — AIの回答は変動するため、定期的に再測定し改善サイクルを回す。
    - heading "よくある質問" [level=2] [ref=f11e99]
    - paragraph [ref=f11e100]:
      - strong [ref=f11e101]: Q. LLMOとAEO・GEOの違いは何ですか？
      - text: A. いずれもAI検索最適化を指す近い概念です。LLMOは大規模言語モデル全般、GEOは生成エンジン、AEOは回答エンジンと着眼点が異なりますが、実務上のアプローチはほぼ共通しています。詳しくは「
      - link "LLMO・GEO・AEOの違い" [ref=f11e102] [cursor=pointer]:
        - /url: /trillionbank/news/llmo-geo-aeo/
      - text: 」で整理しています。
    - paragraph [ref=f11e103]:
      - strong [ref=f11e104]: Q. SEOをやっていればLLMOは不要ですか？
      - text: A. SEOとLLMOは目的が異なるため、SEO対策だけではAI検索での引用は保証されません。両方を併存させて取り組むのが現実的です。
    - paragraph [ref=f11e105]:
      - strong [ref=f11e106]: Q. 効果はすぐ出ますか？
      - text: A. AIの回答は頻繁に変動します。単発ではなく、引用率・出現率のトレンドで捉え、継続的に改善する前提で取り組むことが推奨されます。
    - heading "トリリオンバンクのアプローチ" [level=2] [ref=f11e107]
    - paragraph [ref=f11e108]:
      - text: 株式会社トリリオンバンク（Trillion Bank Inc.）は、LLMO/AIO領域を支援するAI検索インテリジェンス
      - strong [ref=f11e109]:
        - link "HackⅡ" [ref=f11e110] [cursor=pointer]:
          - /url: /trillionbank/business/hack2/
        - text: （開発中・導入相談受付）
      - text: を開発しています。HackⅡは、AI検索での自社・競合の引用状況を測定し、最適化の優先度を可視化することを目指しています。
    - paragraph [ref=f11e111]:
      - text: まずは
      - strong [ref=f11e112]:
        - link "お問い合わせ" [ref=f11e113] [cursor=pointer]:
          - /url: /trillionbank/contact/
      - text: から、現状を可視化してみてください。
